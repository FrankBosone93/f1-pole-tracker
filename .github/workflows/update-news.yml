name: Aggiorna news F1

on:
  schedule:
    # A differenza delle altre automazioni (legate a un momento preciso del
    # weekend di gara), le news escono in continuazione: aggiorniamo ogni
    # 4 ore, tutti i giorni.
    - cron: '0 */4 * * *'
  workflow_dispatch: {}   # permette di lanciarlo manualmente da GitHub > Actions > Run workflow

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Esegui script di aggiornamento news
        run: node scripts/update-news.js

      - name: Commit e push se news.json è cambiato
        run: |
          if git diff --quiet -- news.json; then
            echo "Nessuna modifica a news.json, niente da committare."
          else
            git config user.name "F1 Pole Tracker Bot"
            git config user.email "actions@users.noreply.github.com"
            git add news.json
            git commit -m "📰 Aggiornamento automatico news"
            git push
          fi
