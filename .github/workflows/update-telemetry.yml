name: Aggiorna telemetria pole position F1

on:
  schedule:
    # Stesso orario di update-poles.yml: la telemetria di OpenF1 riguarda lo
    # stesso giro di pole in qualifica, quindi è disponibile grosso modo
    # nella stessa finestra oraria (sabato pomeriggio/sera UTC).
    - cron: '0 18 * * 6'
    - cron: '0 22 * * 6'
  workflow_dispatch: {}   # permette di lanciarlo manualmente da GitHub > Actions > Run workflow

permissions:
  contents: write

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Esegui script di aggiornamento telemetria
        run: node scripts/build-telemetry.js

      - name: Commit e push se telemetry.json è cambiato
        run: |
          if git diff --quiet -- telemetry.json; then
            echo "Nessuna modifica a telemetry.json, niente da committare."
          else
            git config user.name "F1 Pole Tracker Bot"
            git config user.email "actions@users.noreply.github.com"
            git add telemetry.json
            git commit -m "🏎️ Aggiornamento automatico telemetria pole position"
            git push
          fi
