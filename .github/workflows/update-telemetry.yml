name: Aggiorna telemetria pole position F1

on:
  schedule:
    # Orari: minuto :23 (non l'ora tonda, vedi update-poles.yml): parte DOPO update-poles (:07), perché usa la pole che quello ha appena scritto in data.json.
    # Stessi giorni/ore (UTC) di update-poles.yml: la telemetria di OpenF1 riguarda lo
    # stesso giro di pole in qualifica, quindi è disponibile grosso modo
    # nella stessa finestra oraria (sabato pomeriggio/sera UTC).
    - cron: '23 18 * * 6'
    - cron: '23 22 * * 6'
    # Run di recupero domenica e lunedì mattina (come update-poles.yml): se
    # OpenF1 non aveva ancora pubblicato i dati di sessione ai run di sabato
    # (o un run è saltato), il giro mancante viene ripreso qui invece di
    # aspettare il sabato dopo. Se non manca nulla è un no-op.
    - cron: '23 6 * * 0'
    - cron: '23 6 * * 1'
  workflow_dispatch: {}   # permette di lanciarlo manualmente da GitHub > Actions > Run workflow

permissions:
  contents: write

jobs:
  update-telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # continue-on-error: lo script scrive comunque status/telemetry.json
      # (con ok:false e il messaggio d'errore) anche se fallisce - deve poter
      # arrivare fino al commit qui sotto, altrimenti il sito non saprebbe
      # mai che questa automazione è KO. Il job resta comunque segnato come
      # fallito grazie all'ultimo step.
      - name: Esegui script di aggiornamento telemetria
        id: run
        continue-on-error: true
        run: node scripts/build-telemetry.js

      - name: Commit e push se telemetry.json o lo stato sono cambiati
        run: |
          if git diff --quiet -- telemetry.json status/telemetry.json; then
            echo "Nessuna modifica, niente da committare."
          else
            git config user.name "F1 Pole Tracker Bot"
            git config user.email "actions@users.noreply.github.com"
            git add telemetry.json status/telemetry.json
            git commit -m "🏎️ Aggiornamento automatico telemetria pole position"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      - name: Fallisci il run se lo script è fallito
        if: steps.run.outcome != 'success'
        run: exit 1
