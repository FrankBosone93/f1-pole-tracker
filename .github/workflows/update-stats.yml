name: Aggiorna statistiche F1

on:
  # Subito dopo ogni aggiornamento dei dati (stessa idea di notify-gp.yml):
  # le statistiche della sezione "Stats" leggono calendario, pole, classifica,
  # telemetria e passo gara, quindi si ricalcolano quando cambia uno di loro.
  # Se non cambia nulla, stats.json non viene riscritto e non c'è commit.
  workflow_run:
    workflows:
      - "Aggiorna pole position F1"
      - "Controlla penalità pole position F1"
      - "Aggiorna classifica campionato F1"
      - "Aggiorna calendario F1"
      - "Aggiorna telemetria pole position F1"
      - "Aggiorna passo gara F1"
      - "Aggiorna tutto (pole, penalità, classifica, calendario, storico, telemetria, passo gara, news)"
    types: [completed]
  schedule:
    # Subito dopo la scadenza del racconto del GP (lib/gp-data.js: il giorno
    # dopo la gara alle 7:00 UTC; domenica per le gare del sabato, come Las
    # Vegas 2023): se manca ancora qualche dato il racconto si scrive con
    # quelli che ci sono (dal 2026-11-10). Senza questo orario potrebbe non
    # esserci nessun aggiornamento dei dati a far ripartire il calcolo. Alla
    # fine parte anche il controllo delle notifiche (notify-gp.yml), che manda
    # il ⚠️ dopo il racconto.
    - cron: '7 7 * * 0,1'
  workflow_dispatch: {}   # permette di lanciarlo manualmente da GitHub > Actions > Run workflow

concurrency:
  group: update-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # L'ultima versione di main, con i dati appena aggiornati.
          ref: main

      # Dal 2026-11-11: impronta dei file che il calcolo legge (dati e codice).
      # Se un giro precedente con la stessa impronta era completo (nulla in
      # attesa da Jolpica, OpenF1 o Claude, vedi build-stats.js) la cache di
      # GitHub ha la chiave e, quando il giro parte da un aggiornamento dei
      # dati, il calcolo si salta: darebbe lo stesso risultato. L'orario del
      # lunedì e il lancio manuale ricalcolano sempre.
      - name: Impronta dei dati letti
        id: inputs
        run: echo "key=stats-settled-${{ hashFiles('calendar.json', 'data.json', 'standings.json', 'telemetry.json', 'pace/**', 'scripts/build-stats.js', 'scripts/lib/**', 'package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Calcolo già completo con questi dati?
        id: settled
        uses: actions/cache/restore@v4
        with:
          path: /tmp/stats-settled
          key: ${{ steps.inputs.outputs.key }}
          lookup-only: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # SDK di Anthropic per il racconto del GP (package-lock.json).
      # --omit=dev: Tailwind (devDependency) serve solo a check-css.yml.
      - name: Installa le dipendenze
        if: steps.settled.outputs.cache-hit != 'true' || github.event_name != 'workflow_run'
        run: npm ci --omit=dev --no-audit --no-fund

      # continue-on-error: lo script scrive comunque status/stats.json (con
      # ok:false in caso di errore), che va committato per l'indicatore del sito.
      - name: Calcola le statistiche
        id: run
        if: steps.settled.outputs.cache-hit != 'true' || github.event_name != 'workflow_run'
        continue-on-error: true
        env:
          STATS_SETTLED_FILE: /tmp/stats-settled/ok
          # Chiave dell'API di Anthropic per il racconto del GP scritto da
          # Claude: senza, la sezione mostra solo l'elenco dei fatti.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build-stats.js

      # Stesso risultato del giro che ha completato il calcolo con questi
      # dati: niente da ricalcolare. Lo stato si aggiorna comunque (ogni 6
      # ore, vedi lib/status.js), per l'indicatore del sito.
      - name: Statistiche già calcolate con questi dati
        if: steps.settled.outputs.cache-hit == 'true' && github.event_name == 'workflow_run'
        run: |
          echo "Dati invariati dall'ultimo calcolo completo: niente da ricalcolare."
          node -e "require('./scripts/lib/status').writeStatus('stats', true)"

      - name: Commit e push se stats.json, l'archivio dei GP o lo stato sono cambiati
        run: |
          if [ -z "$(git status --porcelain -- stats.json stats status/stats.json)" ]; then
            echo "Nessuna modifica, niente da committare."
          else
            git config user.name "F1 Pole Tracker Bot"
            git config user.email "actions@users.noreply.github.com"
            git add stats.json stats status/stats.json
            git commit -m "📊 Aggiornamento automatico statistiche"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      # Dopo il push: se il push fallisse, il giro dopo deve ricalcolare.
      - name: Ricorda che con questi dati il calcolo è completo
        if: steps.run.outcome == 'success' && steps.settled.outputs.cache-hit != 'true'
        id: marker
        run: |
          if [ -f /tmp/stats-settled/ok ]; then echo "save=true" >> "$GITHUB_OUTPUT"; fi

      - name: Salva il calcolo completo nella cache
        if: steps.marker.outputs.save == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/stats-settled
          key: ${{ steps.inputs.outputs.key }}

      - name: Fallisci il run se lo script è fallito
        if: steps.run.outcome == 'failure'
        run: exit 1
