name: Aggiorna classifica campionato F1

on:
  schedule:
    # Gira DOPO la gara (i punti si assegnano in gara, non in qualifica),
    # stesso orario di check-pole-penalty.yml: domenica 18:00 e 22:00 UTC,
    # più un run di sicurezza lunedì mattina per le gare che finiscono più
    # tardi (es. Messico, Brasile, Las Vegas) o in caso di gare interrotte.
    - cron: '0 18 * * 0'
    - cron: '0 22 * * 0'
    - cron: '0 6 * * 1'
  workflow_dispatch: {}   # permette di lanciarlo manualmente da GitHub > Actions > Run workflow

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # continue-on-error: lo script scrive comunque status/standings.json
      # (con ok:false e il messaggio d'errore) anche se fallisce - deve poter
      # arrivare fino al commit qui sotto, altrimenti il sito non saprebbe
      # mai che questa automazione è KO. Il job resta comunque segnato come
      # fallito grazie all'ultimo step.
      - name: Esegui aggiornamento classifica piloti/costruttori
        id: run
        continue-on-error: true
        run: node scripts/update-standings.js

      - name: Commit e push se standings.json o lo stato sono cambiati
        run: |
          if git diff --quiet -- standings.json status/standings.json; then
            echo "Nessuna modifica, niente da committare."
          else
            git config user.name "F1 Pole Tracker Bot"
            git config user.email "actions@users.noreply.github.com"
            git add standings.json status/standings.json
            git commit -m "🏆 Aggiornamento automatico classifica campionato"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      - name: Fallisci il run se lo script è fallito
        if: steps.run.outcome != 'success'
        run: exit 1
