name: Notifica aggiornamento GP

on:
  # Subito dopo ogni aggiornamento dei dati: appena pole, gara, classifica,
  # telemetria e passo gara dell'ultimo GP sono tutti presenti parte il ✅,
  # anche la domenica sera. Prima c'era solo l'orario fisso del lunedì, che
  # GitHub faceva partire con 5-7 ore di ritardo (notifica nel pomeriggio).
  # Lo script esce subito se il GP è già notificato, quindi le partenze in più
  # (es. calendario ogni 2 ore il venerdì e sabato) non producono doppioni.
  workflow_run:
    workflows:
      - "Aggiorna pole position F1"
      - "Controlla penalità pole position F1"
      - "Aggiorna classifica campionato F1"
      - "Aggiorna calendario F1"
      - "Aggiorna telemetria pole position F1"
      - "Aggiorna passo gara F1"
      - "Aggiorna tutto (pole, penalità, classifica, calendario, storico, telemetria, passo gara, news)"
    types: [completed]
  schedule:
    # Rete di sicurezza: lunedì e martedì mattina. Se i dati sono ancora
    # incompleti dopo il lunedì alle 7:00 UTC parte il ⚠️ (vedi notify-gp.js).
    - cron: '13 8 * * 1'
    - cron: '13 8 * * 2'
  workflow_dispatch: {}   # permette di lanciarlo manualmente da GitHub > Actions > Run workflow

# Un controllo alla volta: più aggiornamenti che finiscono insieme non devono
# mandare la stessa notifica due volte.
concurrency:
  group: notify-gp
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify-gp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # L'ultima versione di main (con status/notified.json aggiornato da
          # un eventuale controllo appena finito), non il commit che ha
          # avviato l'aggiornamento dei dati.
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Controlla i dati dell'ultimo GP e invia la notifica
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Notifiche alla web app sulla schermata Home (Web Push): chiave
          # privata VAPID e iscrizioni copiate dal tasto 🔔 Notifiche del sito.
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          WEBPUSH_SUBSCRIPTIONS: ${{ secrets.WEBPUSH_SUBSCRIPTIONS }}
        run: node scripts/notify-gp.js

      # Lo stato (ultimo GP notificato) va in git, così la notifica non si
      # ripete ai run successivi.
      - name: Commit dello stato delle notifiche (se cambiato)
        run: |
          if [ -z "$(git status --porcelain -- status/notified.json)" ]; then
            echo "Nessuna notifica inviata, niente da committare."
          else
            git config user.name "F1 Pole Tracker Bot"
            git config user.email "actions@users.noreply.github.com"
            git add status/notified.json
            git commit -m "🔔 Notifica aggiornamento GP inviata"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi
