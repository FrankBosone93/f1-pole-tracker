name: Aggiorna tutto (pole, penalità, classifica, calendario, storico, telemetria, news)

# Solo manuale: le 7 automazioni singole (update-poles.yml,
# check-pole-penalty.yml, update-standings.yml, update-calendar.yml,
# archive-finished-season.yml, update-telemetry.yml, update-news.yml)
# restano schedulate separatamente come prima. Questo workflow esegue gli
# stessi 7 script in sequenza in un unico run, per non doverli lanciare uno
# alla volta da GitHub quando si vuole aggiornare tutto subito (è il
# workflow collegato al tasto "Full Update" del sito).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configura identità git per i commit automatici
        run: |
          git config user.name "F1 Pole Tracker Bot"
          git config user.email "actions@users.noreply.github.com"

      # continue-on-error su ognuno dei 4 script: se uno fallisce (es. l'API
      # esterna f1api.dev momentaneamente non ha ancora i dati di un round,
      # 404 osservato in un test reale), gli altri tre vanno comunque
      # avanti invece di essere saltati tutti insieme - punto centrale di
      # questo workflow rispetto a lanciarli singolarmente.
      - name: Aggiorna pole position
        id: poles
        continue-on-error: true
        run: node scripts/update-poles.js

      # if: always() (non "solo se success"): status/poles.json va committato
      # anche quando lo script fallisce, altrimenti il sito non vedrebbe mai
      # l'indicatore rosso per questa automazione.
      - name: Commit pole position (se cambiato)
        if: always()
        run: |
          if git diff --quiet -- data.json status/poles.json; then
            echo "Nessuna modifica (pole position)."
          else
            git add data.json status/poles.json
            git commit -m "🏎️ Aggiornamento automatico pole position"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      - name: Controlla penalità pole position
        id: penalty
        continue-on-error: true
        run: node scripts/check-pole-penalty.js

      - name: Commit penalità (se cambiato)
        if: always()
        run: |
          if git diff --quiet -- data.json status/penalty.json; then
            echo "Nessuna modifica (penalità)."
          else
            git add data.json status/penalty.json
            git commit -m "🚩 Aggiornamento automatico avviso penalità pole"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      - name: Aggiorna classifica campionato
        id: standings
        continue-on-error: true
        run: node scripts/update-standings.js

      - name: Commit classifica (se cambiato)
        if: always()
        run: |
          if git diff --quiet -- standings.json status/standings.json; then
            echo "Nessuna modifica (classifica)."
          else
            git add standings.json status/standings.json
            git commit -m "🏆 Aggiornamento automatico classifica campionato"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      - name: Aggiorna calendario
        id: calendar
        continue-on-error: true
        run: node scripts/update-calendar.js

      - name: Commit calendario (se cambiato)
        if: always()
        run: |
          if git diff --quiet -- calendar.json status/calendar.json; then
            echo "Nessuna modifica (calendario)."
          else
            git add calendar.json status/calendar.json
            git commit -m "📅 Aggiornamento automatico calendario"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      # Legge la copia di calendar.json appena aggiornata dallo step sopra,
      # nello stesso job: nessun rischio di leggerne una versione non
      # aggiornata (a differenza del workflow standalone, che gira in un job
      # separato). Per la stragrande maggioranza delle esecuzioni (stagione
      # ancora in corso) è un no-op istantaneo.
      - name: Controlla ed eventualmente archivia la stagione appena conclusa
        id: history
        continue-on-error: true
        run: node scripts/archive-finished-season.js

      - name: Commit storico (se è stato archiviato un nuovo anno)
        if: always()
        run: |
          if git diff --quiet -- history/ status/history.json; then
            echo "Nessuna modifica (storico)."
          else
            git add history/ status/history.json
            git commit -m "🕰️ Archiviazione automatica stagione conclusa"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      - name: Aggiorna telemetria pole position
        id: telemetry
        continue-on-error: true
        run: node scripts/build-telemetry.js

      - name: Commit telemetria (se cambiato)
        if: always()
        run: |
          if git diff --quiet -- telemetry.json status/telemetry.json; then
            echo "Nessuna modifica (telemetria)."
          else
            git add telemetry.json status/telemetry.json
            git commit -m "🏎️ Aggiornamento automatico telemetria pole position"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      - name: Aggiorna news
        id: news
        continue-on-error: true
        run: node scripts/update-news.js

      - name: Commit news (se cambiato)
        if: steps.news.outcome == 'success'
        run: |
          if git diff --quiet -- news.json; then
            echo "Nessuna modifica a news.json."
          else
            git add news.json
            git commit -m "📰 Aggiornamento automatico news"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      - name: Riepilogo
        if: always()
        run: |
          echo "## Riepilogo aggiornamento" >> "$GITHUB_STEP_SUMMARY"
          echo "| Automazione | Esito |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pole position | ${{ steps.poles.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Penalità | ${{ steps.penalty.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Classifica | ${{ steps.standings.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Calendario | ${{ steps.calendar.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Storico | ${{ steps.history.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Telemetria | ${{ steps.telemetry.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| News | ${{ steps.news.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"

      # Se anche solo uno script è fallito, il run resta segnato come
      # fallito (X rosso su GitHub) pur avendo lasciato provare tutti gli
      # altri - così un fallimento non passa inosservato.
      - name: Fallisci il run se qualche automazione è fallita
        if: steps.poles.outcome != 'success' || steps.penalty.outcome != 'success' || steps.standings.outcome != 'success' || steps.calendar.outcome != 'success' || steps.history.outcome != 'success' || steps.telemetry.outcome != 'success' || steps.news.outcome != 'success'
        run: exit 1
