name: Aggiorna tutto (pole, penalità, classifica, calendario, telemetria, news)

# Solo manuale: le 6 automazioni singole (update-poles.yml,
# check-pole-penalty.yml, update-standings.yml, update-calendar.yml,
# update-telemetry.yml, update-news.yml) restano schedulate separatamente
# come prima. Questo workflow esegue gli stessi 6 script in sequenza in un
# unico run, per non doverli lanciare uno alla volta da GitHub quando si
# vuole aggiornare tutto subito (è il workflow collegato al tasto
# "Full Update" del sito).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configura identità git per i commit automatici
        run: |
          git config user.name "F1 Pole Tracker Bot"
          git config user.email "actions@users.noreply.github.com"

      # continue-on-error su ognuno dei 4 script: se uno fallisce (es. l'API
      # esterna f1api.dev momentaneamente non ha ancora i dati di un round,
      # 404 osservato in un test reale), gli altri tre vanno comunque
      # avanti invece di essere saltati tutti insieme - punto centrale di
      # questo workflow rispetto a lanciarli singolarmente.
      - name: Aggiorna pole position
        id: poles
        continue-on-error: true
        run: node scripts/update-poles.js

      - name: Commit pole position (se cambiato)
        if: steps.poles.outcome == 'success'
        run: |
          if git diff --quiet -- data.json; then
            echo "Nessuna modifica a data.json (pole position)."
          else
            git add data.json
            git commit -m "🏎️ Aggiornamento automatico pole position"
            git push
          fi

      - name: Controlla penalità pole position
        id: penalty
        continue-on-error: true
        run: node scripts/check-pole-penalty.js

      - name: Commit penalità (se cambiato)
        if: steps.penalty.outcome == 'success'
        run: |
          if git diff --quiet -- data.json; then
            echo "Nessuna modifica a data.json (penalità)."
          else
            git add data.json
            git commit -m "🚩 Aggiornamento automatico avviso penalità pole"
            git push
          fi

      - name: Aggiorna classifica campionato
        id: standings
        continue-on-error: true
        run: node scripts/update-standings.js

      - name: Commit classifica (se cambiato)
        if: steps.standings.outcome == 'success'
        run: |
          if git diff --quiet -- standings.json; then
            echo "Nessuna modifica a standings.json."
          else
            git add standings.json
            git commit -m "🏆 Aggiornamento automatico classifica campionato"
            git push
          fi

      - name: Aggiorna calendario
        id: calendar
        continue-on-error: true
        run: node scripts/update-calendar.js

      - name: Commit calendario (se cambiato)
        if: steps.calendar.outcome == 'success'
        run: |
          if git diff --quiet -- calendar.json; then
            echo "Nessuna modifica a calendar.json."
          else
            git add calendar.json
            git commit -m "📅 Aggiornamento automatico calendario"
            git push
          fi

      - name: Aggiorna telemetria pole position
        id: telemetry
        continue-on-error: true
        run: node scripts/build-telemetry.js

      - name: Commit telemetria (se cambiato)
        if: steps.telemetry.outcome == 'success'
        run: |
          if git diff --quiet -- telemetry.json; then
            echo "Nessuna modifica a telemetry.json."
          else
            git add telemetry.json
            git commit -m "🏎️ Aggiornamento automatico telemetria pole position"
            git push
          fi

      - name: Aggiorna news
        id: news
        continue-on-error: true
        run: node scripts/update-news.js

      - name: Commit news (se cambiato)
        if: steps.news.outcome == 'success'
        run: |
          if git diff --quiet -- news.json; then
            echo "Nessuna modifica a news.json."
          else
            git add news.json
            git commit -m "📰 Aggiornamento automatico news"
            git push
          fi

      - name: Riepilogo
        if: always()
        run: |
          echo "## Riepilogo aggiornamento" >> "$GITHUB_STEP_SUMMARY"
          echo "| Automazione | Esito |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pole position | ${{ steps.poles.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Penalità | ${{ steps.penalty.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Classifica | ${{ steps.standings.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Calendario | ${{ steps.calendar.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Telemetria | ${{ steps.telemetry.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| News | ${{ steps.news.outcome == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"

      # Se anche solo uno script è fallito, il run resta segnato come
      # fallito (X rosso su GitHub) pur avendo lasciato provare tutti gli
      # altri - così un fallimento non passa inosservato.
      - name: Fallisci il run se qualche automazione è fallita
        if: steps.poles.outcome != 'success' || steps.penalty.outcome != 'success' || steps.standings.outcome != 'success' || steps.calendar.outcome != 'success' || steps.telemetry.outcome != 'success' || steps.news.outcome != 'success'
        run: exit 1
