name: Aggiorna calendario F1

on:
  schedule:
    # Orari: minuti fuori dall'ora tonda (i cron alle ore tonde sono i più ritardati/congestionati): :31, prima di archive-finished-season (:53) che legge calendar.json.
    # Venerdì e sabato (prove libere, sprint, qualifiche): gira ogni 2 ore
    # tutto il giorno, perché gli orari delle sessioni cambiano moltissimo da
    # circuito a circuito (es. Melbourne FP1 alle 01:30 UTC, Austin alle
    # 17:30 UTC) - non è possibile agganciarsi all'orario esatto di fine di
    # ogni sessione per tutti i GP con un cron fisso. Ogni run scarica solo le
    # sessioni nuove già disputate (vedi update-calendar.js), quindi nei
    # weekend senza gara o fuori sessione è un no-op istantaneo.
    - cron: '31 */2 * * 5'
    - cron: '31 */2 * * 6'
    # Domenica (gara) e lunedì: stessi giorni/ore (UTC) di check-pole-penalty.yml e
    # update-standings.yml, cambia solo il minuto: domenica 18:00 e 22:00 UTC, più un run di
    # sicurezza lunedì mattina per le gare che finiscono più tardi (es.
    # Messico, Brasile, Las Vegas) o in caso di gare interrotte.
    - cron: '31 18 * * 0'
    - cron: '31 22 * * 0'
    - cron: '31 6 * * 1'
  workflow_dispatch: {}   # permette di lanciarlo manualmente da GitHub > Actions > Run workflow

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # continue-on-error: lo script scrive comunque status/calendar.json
      # (con ok:false e il messaggio d'errore) anche se fallisce - deve poter
      # arrivare fino al commit qui sotto, altrimenti il sito non saprebbe
      # mai che questa automazione è KO. Il job resta comunque segnato come
      # fallito grazie all'ultimo step.
      - name: Esegui aggiornamento calendario
        id: run
        continue-on-error: true
        run: node scripts/update-calendar.js

      - name: Commit e push se calendar.json o lo stato sono cambiati
        run: |
          # git status e non git diff: auto-circuits.json (circuiti nuovi riconosciuti
          # in automatico) la prima volta è un file nuovo, che git diff non vede.
          if [ -z "$(git status --porcelain -- calendar.json status/calendar.json auto-circuits.json)" ]; then
            echo "Nessuna modifica, niente da committare."
          else
            git config user.name "F1 Pole Tracker Bot"
            git config user.email "actions@users.noreply.github.com"
            git add calendar.json status/calendar.json $(ls auto-circuits.json 2>/dev/null)
            git commit -m "📅 Aggiornamento automatico calendario"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      # Pole e telemetria subito dopo i risultati della qualifica, senza
      # aspettare gli orari fissi di update-poles.yml / update-telemetry.yml
      # (che restano come recupero): quei cron partono anche con ore di
      # ritardo, e la pole arrivava sul sito ore dopo i tempi delle qualifiche
      # già visibili nel Prossimo GP. pole-pending.js legge solo i file locali:
      # se non manca nulla questi passaggi non chiamano nessuna API.
      - name: Pole mancante con i risultati della qualifica già salvati?
        id: pending
        run: |
          echo "poles=$(node scripts/pole-pending.js poles)" >> "$GITHUB_OUTPUT"

      - name: Aggiorna subito la pole position
        id: poles
        if: steps.pending.outputs.poles == 'true'
        continue-on-error: true
        run: node scripts/update-poles.js

      - name: Telemetria della pole mancante?
        id: pending_tel
        run: |
          echo "telemetry=$(node scripts/pole-pending.js telemetry)" >> "$GITHUB_OUTPUT"

      - name: Aggiorna subito la telemetria
        id: telemetry
        if: steps.pending_tel.outputs.telemetry == 'true'
        continue-on-error: true
        run: node scripts/build-telemetry.js

      - name: Commit e push di pole e telemetria se cambiate
        if: steps.poles.conclusion != 'skipped' || steps.telemetry.conclusion != 'skipped'
        run: |
          if [ -z "$(git status --porcelain -- data.json status/poles.json telemetry.json status/telemetry.json tracks)" ]; then
            echo "Nessuna modifica, niente da committare."
          else
            git config user.name "F1 Pole Tracker Bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json status/poles.json telemetry.json status/telemetry.json tracks
            git commit -m "🏎️ Aggiornamento automatico pole position e telemetria (dopo i risultati della qualifica)"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi

      - name: Fallisci il run se uno script è fallito
        if: steps.run.outcome != 'success' || steps.poles.outcome == 'failure' || steps.telemetry.outcome == 'failure'
        run: exit 1
