name: Aggiorna meteo previsto

on:
  schedule:
    # Ogni 3 ore al minuto :37, non all'ora tonda (i cron alle ore tonde sono
    # i più ritardati/congestionati su GitHub Actions). Lo script scarica le
    # previsioni solo nella settimana del GP, fino alla fine della gara: negli
    # altri giorni non fa richieste e non committa niente.
    - cron: '37 */3 * * *'
  workflow_dispatch: {}   # permette di lanciarlo manualmente da GitHub > Actions > Run workflow

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scarica le previsioni del Prossimo GP
        run: node scripts/update-forecast.js

      # git status e non git diff: la prima volta forecast.json potrebbe
      # essere un file nuovo, che git diff non vede.
      - name: Commit e push se forecast.json è cambiato
        run: |
          if [ -z "$(git status --porcelain -- forecast.json)" ]; then
            echo "Nessuna modifica a forecast.json, niente da committare."
          else
            git config user.name "F1 Pole Tracker Bot"
            git config user.email "actions@users.noreply.github.com"
            git add forecast.json
            git commit -m "🌦️ Aggiornamento automatico meteo previsto"
            source scripts/lib/push-with-retry.sh
            push_with_retry
          fi
