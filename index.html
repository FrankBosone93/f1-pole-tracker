<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Pole Position Tracker Completo (2021-2026)</title>

    <!-- PWA: installabile su home screen (iOS/Android) come app a schermo
         intero, con icona e nome propri - vedi manifest.json e sw.js. -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="F1 Pole Tracker">

    <!-- Versioni FISSE con controllo di integrità (SRI): prima puntavano
         alla "ultima versione" (@4 / senza versione), quindi una release
         nuova o un file alterato sul CDN poteva rompere o compromettere il
         sito senza che nessun commit lo avesse toccato. Per aggiornare:
         cambiare versione E hash (openssl dgst -sha384 -binary file | openssl base64 -A). -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!-- Tailwind CSS per la grafica -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3" integrity="sha384-aJ9rL4k6lF+91guGvUFVSkpIcge7Zd9EiI4TQDLoK9kFaFJgKHgjEXVvG/qA5COj" crossorigin="anonymous"></script>
    <!-- Chart.js per il grafico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: system-ui, sans-serif; }
        /* Telefono ruotato in orizzontale (classe messa da applyLayoutMode):
           lo schermo è largo come un tablet ma alto meno di 500px, quindi il
           layout desktop a due colonne (grafico alto 440px) non ci starebbe.
           Si usa una colonna sola, col grafico a tutta larghezza e alto
           quanto lo schermo, e il widget "Prossimo GP" in versione mobile. */
        body.phone-landscape { padding-left: 12px; padding-right: 12px; max-width: none !important; }
        body.phone-landscape #mainGrid { display: block !important; }
        body.phone-landscape #resizeHandle,
        body.phone-landscape #vResizeHandle { display: none !important; }
        body.phone-landscape #leftColumn { position: static !important; }
        body.phone-landscape #chartCard { margin-bottom: 1.5rem; }
        body.phone-landscape #featuredRaceWidget { display: block !important; }
        body.phone-landscape #featuredRaceWidgetDesktop { display: none !important; }
        body.phone-landscape #telemetryStatsGrid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-md md:max-w-6xl mx-auto pb-12 pt-3 md:pt-4">

    <!-- Su desktop l'header diventa una riga: titolo + selettore circuito a
         sinistra, widget "Prossimo GP" in alto a destra. Il selettore vive
         qui (non più dentro leftColumn) per due motivi: sfrutta lo spazio
         verticale che l'header occupa comunque per pareggiare l'altezza del
         widget (altrimenti sprecato, vuoto), e lascia il grafico come primo
         elemento di leftColumn, così il suo bordo superiore combacia
         naturalmente con quello del primo riquadro di "Dettagli Qualifiche"
         (entrambi primi figli delle rispettive colonne di mainGrid), senza
         bisogno di correzioni via JS. Su mobile l'ordine visivo resta
         identico a prima (titolo, poi selettore, poi grafico), dato che
         l'header precede comunque mainGrid nel flusso del documento. -->
    <header class="mt-2 md:mt-3 mb-1 md:mb-2 md:relative md:flex md:items-start md:justify-between md:gap-6">
        <div class="text-center md:text-left">
            <h1 class="text-2xl md:text-4xl font-bold text-[#E10600] tracking-wider"><a href="./" onclick="goHome(event)" title="Torna alla home e ricarica" class="hover:opacity-80 transition-opacity">F1 POLE TRACKER</a></h1>
            <p class="text-gray-400 text-sm md:text-base">Calendario Completo Storico & Live 2021 - 2026</p>
            <p id="dataSourceBadge" class="text-[10px] text-gray-600 mt-1">Caricamento dati...</p>

            <!-- Widget "Prossimo GP" versione MOBILE (riquadro con bordo,
                 come le altre card impilate su mobile): qui, sopra il
                 selettore circuito, così su schermi piccoli si vede subito.
                 Nascosto su desktop, dove vive #featuredRaceWidgetDesktop
                 (in alto a destra, posizionato in assoluto) invece. -->
            <div id="featuredRaceWidget" class="mt-4 mb-4 md:hidden text-left"></div>

            <div class="mt-4 md:mt-6 mb-6 md:mb-0 md:w-96 text-left">
                <label for="circuitSelect" class="block text-sm font-medium text-gray-300 mb-2">Scegli un circuito:</label>
                <select id="circuitSelect" class="w-full bg-[#1E1E1E] text-white text-base md:text-lg border border-gray-700 rounded-lg p-3 md:p-4 focus:outline-none focus:border-[#E10600]">
                    <!-- Inseriti automaticamente dallo script -->
                </select>
            </div>
        </div>
        <!-- Posizionato in assoluto (non più nel flusso flex) apposta: se
             fosse un normale figlio flex, l'header prenderebbe l'altezza del
             lato più alto (di solito titolo+selettore) e lascerebbe uno
             spazio vuoto visibile sotto il widget quando è lui il più corto
             (segnalato dall'utente). Così l'header si alza solo quanto serve
             al titolo+selettore, e il widget resta ancorato in alto a
             destra senza influenzare quell'altezza. -->
        <div id="featuredRaceWidgetDesktop" class="hidden md:block md:absolute md:top-0 md:right-0 text-left pt-1"></div>
    </header>

    <div id="mainGrid" class="md:grid md:gap-4 md:items-start" style="grid-template-columns: 66.67% 12px 33.33%;">

        <!-- Colonna sinistra (desktop, 2/3 dello schermo di default, trascinabile): grafico, classifica. Su mobile è semplicemente in cima. -->
        <div id="leftColumn" class="md:sticky md:top-8">
            <!-- Contenitore Grafico -->
            <div id="chartCard" class="bg-[#1E1E1E] px-2 py-3 md:p-4 rounded-xl border border-gray-800 mb-6 md:mb-0">
                <div class="flex items-center justify-between gap-2 mb-2">
                    <div class="flex items-center gap-2">
                        <button id="telemetryToggle" onclick="toggleTelemetryView()" class="hidden text-xs text-gray-300 hover:text-white transition-colors cursor-pointer">
                            Telemetria
                        </button>
                        <!-- Visibile solo in modalità telemetria, e solo se il
                             circuito ha dati anche per almeno un'altra
                             stagione oltre alla 2026: le opzioni (una per
                             stagione disponibile) sono popolate via JS da
                             updateTelemetryButtonsVisibility(). Sovrappone
                             la stagione scelta (attivo = testo rosso). -->
                        <select id="telemetryCompareSelect" aria-label="Confronta con la pole di un'altra stagione" onchange="onTelemetryCompareChange()" class="hidden text-xs bg-transparent text-gray-300 hover:text-white transition-colors cursor-pointer border-none outline-none appearance-none">
                        </select>
                    </div>
                    <div class="flex items-center gap-2 ml-auto">
                        <span id="chartCaption" class="text-xs text-gray-400">Andamenti tempi</span>
                        <button id="chartViewToggle" onclick="toggleChartView()" class="text-gray-200 hover:text-white transition-colors cursor-pointer p-1 -m-1 rounded"></button>
                        <button id="shareBtn" onclick="shareCurrentView()" title="Condividi questa vista" aria-label="Condividi questa vista" class="text-gray-200 hover:text-white transition-colors cursor-pointer p-1 -m-1 rounded">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line></svg>
                        </button>
                    </div>
                </div>
                <div id="chartContainer" class="relative w-full h-[200px] md:h-[440px] overflow-hidden transition-opacity duration-200">
                    <canvas id="poleChart"></canvas>
                    <!-- Pannelli telemetria (nascosti finché non si attiva la
                         vista "Telemetria"): velocità, acceleratore/freno,
                         marcia impilati in colonna, stessa area del grafico
                         principale (position:absolute inset-0) così condividono
                         lo stesso ridimensionamento senza calcoli separati. -->
                    <div id="telemetryPanels" class="hidden absolute inset-0 flex flex-col gap-2">
                        <div class="flex-[3] relative min-h-0"><canvas id="telemetrySpeedChart"></canvas></div>
                        <div class="flex-[2] relative min-h-0"><canvas id="telemetryThrottleBrakeChart"></canvas></div>
                        <div class="flex-[1] relative min-h-0"><canvas id="telemetryGearChart"></canvas></div>
                    </div>
                </div>
                <!-- Statistiche del giro (solo in vista Telemetria): valori
                     riassuntivi a riposo, valori nel punto indicato quando si
                     passa col mouse/dito sui grafici - vedi renderTelemetryStats. -->
                <div id="telemetryStats" class="hidden mt-3">
                    <div id="telemetryStatsHeader" class="text-[11px] text-gray-500 mb-1.5"></div>
                    <div id="telemetryStatsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
                </div>
            </div>

            <!-- Divisore trascinabile (solo desktop) per ridimensionare l'altezza del grafico.
                 Il pillolo interno viene centrato via JS sull'asse X reale del grafico (non
                 sulla larghezza della card), quindi qui niente justify-center. -->
            <div id="vResizeHandle" class="hidden md:flex w-full items-center cursor-row-resize group py-3">
                <div class="h-1 w-24 rounded-full bg-gray-700 group-hover:bg-[#E10600] transition-colors"></div>
            </div>

            <!-- Pulsanti Vista Classifica / Calendario / Stagioni precedenti / News.
                 Su mobile: griglia 2x2. Su desktop: riga unica. -->
            <div class="grid grid-cols-2 gap-2 mb-6 md:flex md:max-w-lg">
                <button onclick="toggleClassificaPanel()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs py-2 px-3 rounded-lg border border-gray-700 transition-colors cursor-pointer">
                    🏆 Classifica
                </button>
                <button onclick="toggleCalendarPanel()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs py-2 px-3 rounded-lg border border-gray-700 transition-colors cursor-pointer">
                    📅 <span id="calendarButtonLabel">Calendario & Risultati</span>
                </button>
                <button onclick="togglePreviousYearsPanel()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs py-2 px-3 rounded-lg border border-gray-700 transition-colors cursor-pointer">
                    🕰️ Stagioni precedenti
                </button>
                <button onclick="toggleNewsPanel()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs py-2 px-3 rounded-lg border border-gray-700 transition-colors cursor-pointer">
                    📰 News
                </button>
            </div>

            <!-- Pannello Classifica (Nascosto di default). Larghezza impostata via
                 JS pari al 2/3 di default del grafico (vedi applyClassificaPanelWidth),
                 indipendente da un eventuale ridimensionamento live del grafico stesso. -->
            <div id="classificaPanel" class="hidden bg-[#1E1E1E] p-4 rounded-xl border border-gray-800 mb-6 transition-opacity duration-200">
                <div class="text-xs text-gray-500 pb-2 mb-4 border-b border-gray-700" id="classificaMeta"></div>
                <div class="space-y-4 md:space-y-0 md:grid md:grid-cols-2 md:gap-6">
                    <div>
                        <h3 class="text-sm font-bold text-[#E10600] mb-2" id="driverRankingTitle">🏆 Classifica Piloti</h3>
                        <div id="driverRanking" class="space-y-1 text-sm"></div>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-[#E10600] mb-2" id="teamRankingTitle">🏆 Classifica Costruttori</h3>
                        <div id="teamRanking" class="space-y-1 text-sm"></div>
                    </div>
                </div>
            </div>

            <!-- Pannello Calendario (Nascosto di default) -->
            <div id="calendarPanel" class="hidden md:max-w-sm bg-[#1E1E1E] p-4 rounded-xl border border-gray-800 mb-6 space-y-3 transition-opacity duration-200">
                <h3 class="text-sm font-bold text-[#E10600]" id="calendarPanelTitle">📅 Calendario</h3>
                <div class="text-xs text-gray-500 pb-2 border-b border-gray-700" id="calendarMeta"></div>
                <div id="calendarList" class="space-y-1 text-sm"></div>
            </div>

            <!-- Pannello Stagioni precedenti (Nascosto di default): prima l'elenco
                 degli anni, poi (cliccandone uno) l'elenco gare/risultati di
                 quella stagione, con lo stesso stile del pannello Calendario. -->
            <div id="previousYearsPanel" class="hidden md:max-w-sm bg-[#1E1E1E] p-4 rounded-xl border border-gray-800 mb-6 space-y-3">
                <div class="flex items-center gap-3">
                    <button id="prevYearsBackBtn" onclick="showPreviousYearsList()" class="hidden text-gray-400 hover:text-white text-xs cursor-pointer">← Anni</button>
                    <h3 class="text-sm font-bold text-[#E10600]" id="previousYearsTitle">🕰️ Stagioni precedenti</h3>
                </div>
                <div id="previousYearsBody" class="space-y-1 text-sm transition-opacity duration-200"></div>
            </div>

            <!-- Pannello News (Nascosto di default): ultime 5 notizie F1 da
                 FormulaPassion.it (news.json, scaricato da update-news.js). -->
            <div id="newsPanel" class="hidden md:max-w-lg bg-[#1E1E1E] p-4 rounded-xl border border-gray-800 mb-6 space-y-3 transition-opacity duration-200">
                <h3 class="text-sm font-bold text-[#E10600]">📰 News</h3>
                <div id="newsList" class="space-y-3 text-sm"></div>
                <div class="text-xs text-gray-500 pt-2 border-t border-gray-700" id="newsMeta"></div>
            </div>
        </div>

        <!-- Divisore trascinabile (solo desktop) per ridimensionare le due colonne.
             Ancorato verticalmente al centro del grafico (non a tutta l'altezza
             della colonna), così non si sposta quando si apre il pannello classifica. -->
        <div id="resizeHandle" class="hidden md:flex md:sticky md:top-8 relative cursor-col-resize group">
            <div class="absolute left-1/2 -translate-x-1/2 w-1 h-24 rounded-full bg-gray-700 group-hover:bg-[#E10600] transition-colors"></div>
        </div>

        <!-- Colonna destra (desktop): lista dettagli, impilata verticalmente.
             Larghezza limitata via JS al massimo alla misura "di default" (vedi
             applyDetailsColumnWidth): il ridimensionamento del grafico può farla
             restringere (se il grafico si allarga oltre il default) ma mai
             allargare oltre la dimensione di default. È ancorata al bordo destro
             (margin-left: auto), così resta sempre nella stessa posizione e non
             si sovrappone mai al pannello Classifica, qualunque sia il drag. -->
        <div id="detailsColumn">
            <h2 class="text-lg font-bold mb-3 text-gray-200">Dettagli Qualifiche</h2>
            <div id="detailsList" class="space-y-3">
                <!-- I dettagli compariranno qui -->
            </div>

            <!-- Tasto "Full Update": sempre subito dopo #detailsList (non
                 all'interno), quindi resta sempre sotto l'ultimo riquadro
                 qualsiasi sia il numero di anni presenti (aumenta di uno
                 ogni stagione) - nessuna posizione da ricalcolare via JS.
                 Apre la pagina del workflow combinato "Aggiorna tutto" su
                 GitHub Actions (un solo "Run workflow" esegue in sequenza
                 pole position, penalità, classifica, calendario e
                 telemetria): il sito è statico, non può contenere un token
                 per lanciarlo direttamente senza esporlo a chiunque lo
                 visiti. -->
            <div class="mt-6 mb-2 text-center md:text-left">
                <a href="https://github.com/FrankBosone93/f1-pole-tracker/actions/workflows/update-all.yml" target="_blank" rel="noopener noreferrer"
                   class="inline-block bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm py-2 px-4 rounded-lg border border-gray-700 transition-colors cursor-pointer">
                    🔄 Full Update
                </a>
                <p class="text-xs text-gray-600 mt-1">Aggiornamento Dati completo</p>
            </div>
        </div>

    </div>

    <div id="toast" role="status" aria-live="polite" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-50 bg-gray-800 text-gray-100 text-sm px-4 py-2 rounded-lg border border-gray-700 shadow-lg opacity-0 pointer-events-none transition-opacity duration-200"></div>

    <script>
        // --- LAYOUT: desktop, telefono verticale, telefono ruotato ---------
        // Telefono ruotato = schermo orizzontale, basso (< 500px) e touch: per
        // larghezza sarebbe "desktop", ma il layout a due colonne non ci sta.
        function isPhoneLandscape() {
            return window.matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)').matches;
        }
        function isDesktopLayout() {
            return window.innerWidth >= 768 && !isPhoneLandscape();
        }
        // Telefono verticale (schermo stretto): asse Y della telemetria
        // compatto, per lasciare più spazio orizzontale alle curve.
        function isCompactTelemetryAxis() {
            return !isDesktopLayout() && window.innerWidth < 600;
        }
        function applyLayoutMode() {
            document.body.classList.toggle('phone-landscape', isPhoneLandscape());
        }
        applyLayoutMode();

        // baseData = fonte di verità "ufficiale", caricata da data.json con fetch() più sotto.
        let baseData = [];
        let poleData = [];
        let standingsData = null; // classifica piloti/costruttori reale, da standings.json
        let calendarData = null; // calendario stagione in corso, da calendar.json
        let telemetryData = null; // telemetria giro di pole per stagione (solo qualifiche), da telemetry.json
        const DEFAULT_TELEMETRY_SEASON = '2026'; // stagione mostrata di default in vista Telemetria
        // Stagione mostrata come "principale" nel grafico Telemetria: di
        // default 2026, ma diventa quella scelta cliccando su un box
        // "Dettagli Qualifiche" con dati telemetrici (vedi showTelemetryForYear).
        // Torna al default ad ogni cambio circuito (updateApp).
        let telemetryPrimarySeason = DEFAULT_TELEMETRY_SEASON;
        let telemetryCompareYear = null; // stagione scelta per il confronto (es. '2025'), o null se nessuna
        let newsData = null; // ultime notizie F1 da FormulaPassion.it, da news.json

        // Legge il giro di pole di una stagione+circuito da telemetryData,
        // null se non disponibile (stagione non scaricata o circuito senza
        // dati per quella stagione - es. qualifica cancellata su OpenF1).
        function getTelemetryEntry(season, circuitName) {
            const seasonData = telemetryData && telemetryData.seasons && telemetryData.seasons[season];
            return (seasonData && seasonData.circuits && seasonData.circuits[circuitName]) || null;
        }

        const select = document.getElementById('circuitSelect');
        const detailsList = document.getElementById('detailsList');
        const dataSourceBadge = document.getElementById('dataSourceBadge');
        let currentChart = null;
        let telemetrySpeedChart = null;
        let telemetryThrottleBrakeChart = null;
        let telemetryGearChart = null;
        let currentFiltered = [];
        // 'line' = andamento dei tempi (attuale), 'delta' = variazione anno su anno.
        let chartViewMode = 'line';

        const ICON_BARS = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="14"></line><line x1="12" y1="20" x2="12" y2="8"></line><line x1="18" y1="20" x2="18" y2="4"></line></svg>';
        const ICON_CURVE = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-1 3-9 6-9s3 10 6 10 3-9 6-9"></path></svg>';

        function updateChartViewToggleIcon() {
            const btn = document.getElementById('chartViewToggle');
            const caption = document.getElementById('chartCaption');
            if (!btn) return;
            if (chartViewMode === 'delta') {
                btn.innerHTML = ICON_CURVE;
                btn.title = "Torna all'andamento dei tempi";
                if (caption) caption.innerText = 'Delta';
            } else {
                btn.innerHTML = ICON_BARS;
                btn.title = 'Vedi il delta anno su anno';
                if (caption) caption.innerText = 'Andamenti tempi';
            }
        }

        // --- LINK CONDIVISIBILI -------------------------------------------
        // Lo stato della vista vive nell'hash dell'indirizzo, p.es.
        //   #c=Monza&view=telemetry&y=2023&vs=2024
        //   c    = circuito (nome come nel menu)
        //   view = "telemetry" | "delta" (assente = grafico dei tempi)
        //   y    = anno principale della telemetria (assente = 2026)
        //   vs   = anno di confronto della telemetria
        // L'hash non arriva mai al server (il sito è statico) e si aggiorna con
        // replaceState: niente voci extra nella cronologia del browser.
        function parseUrlState() {
            const p = new URLSearchParams(location.hash.replace(/^#/, ''));
            return { circuit: p.get('c'), mode: p.get('view'), year: p.get('y'), compare: p.get('vs') };
        }

        function buildUrlHash() {
            const p = new URLSearchParams();
            p.set('c', select.value);
            if (chartViewMode === 'telemetry') {
                p.set('view', 'telemetry');
                if (telemetryPrimarySeason !== DEFAULT_TELEMETRY_SEASON) p.set('y', telemetryPrimarySeason);
                if (telemetryCompareYear) p.set('vs', telemetryCompareYear);
            } else if (chartViewMode === 'delta') {
                p.set('view', 'delta');
            }
            return '#' + p.toString().replace(/\+/g, '%20'); // spazi come %20, più leggibile di +
        }

        function syncUrlState() {
            if (!select.value) return;
            const hash = buildUrlHash();
            if (hash !== location.hash) {
                try { history.replaceState(null, '', hash); } catch (err) { /* es. file:// */ }
            }
        }

        // Clic sul titolo: ricarica il sito aggiornato e riparte dalla home,
        // senza circuito/vista nell'indirizzo, così sparisce ogni
        // personalizzazione fatta durante la consultazione (circuito, vista,
        // pannelli aperti, dimensioni trascinate). Prima di navigare si
        // rivalida index.html con cache:'reload': la cache HTTP di GitHub
        // Pages lo terrebbe per 10 minuti, e si rivedrebbe la versione vecchia.
        async function goHome(event) {
            event.preventDefault();
            try { await fetch(location.pathname, { cache: 'reload' }); } catch (err) { /* offline: si ricarica comunque */ }
            if (location.hash || location.search) location.replace(location.pathname);
            else location.reload();
        }

        let toastTimer = null;
        function showToast(message) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.innerText = message;
            el.classList.remove('opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.add('opacity-0'), 2200);
        }

        // Su telefono apre il foglio di condivisione nativo; altrove copia il
        // link negli appunti (con un prompt come ultimo ripiego).
        async function shareCurrentView() {
            syncUrlState();
            const url = location.href;
            const view = chartViewMode === 'telemetry' ? ` - telemetria ${telemetryPrimarySeason}${telemetryCompareYear ? ' vs ' + telemetryCompareYear : ''}` : '';
            const title = `F1 Pole Tracker - ${select.value}${view}`;
            if (navigator.share && window.matchMedia('(pointer: coarse)').matches) {
                try {
                    await navigator.share({ title, url });
                    return;
                } catch (err) {
                    if (err && err.name === 'AbortError') return; // l'utente ha annullato
                }
            }
            try {
                await navigator.clipboard.writeText(url);
                showToast('Link copiato negli appunti');
            } catch (err) {
                window.prompt('Copia il link:', url);
            }
        }

        function toggleChartView() {
            chartViewMode = chartViewMode === 'line' ? 'delta' : 'line';
            updateChartViewToggleIcon();
            syncUrlState();
            // Dissolvenza gestita a mano invece di affidarsi all'animazione
            // d'ingresso di Chart.js: quest'ultima può completarsi quasi
            // istantaneamente (osservato su desktop) a seconda di quando il
            // browser consegna il primo frame, rendendo il cambio di vista
            // uguale su tutti i dispositivi.
            chartContainer.style.opacity = '0';
            setTimeout(() => {
                renderChart();
                chartContainer.style.opacity = '1';
            }, 200);
        }

        // Il tasto "Telemetria" appare solo se il circuito scelto ha dati
        // telemetrici 2026 (solo qualifiche - vedi telemetry.json); la
        // visibilità viene aggiornata da updateTelemetryButtonsVisibility()
        // ad ogni cambio circuito o cambio di vista, non qui.
        function updateTelemetryToggleLabel() {
            const btn = document.getElementById('telemetryToggle');
            if (!btn) return;
            btn.innerText = chartViewMode === 'telemetry' ? 'Torna al grafico' : 'Telemetria';
        }

        // Ultime due cifre di un anno (stringa o numero), per le etichette
        // brevi tipo "'25" già usate sul grafico.
        function yy(year) {
            return String(year).slice(-2);
        }

        // Il select di confronto (sovrapposizione) appare solo in vista
        // telemetria e solo se il circuito ha dati anche per almeno un'altra
        // stagione oltre a quella primaria (2026); lo stile riflette se un
        // confronto è attivo (testo rosso) o no.
        function updateTelemetryCompareSelectStyle() {
            const sel = document.getElementById('telemetryCompareSelect');
            if (!sel) return;
            sel.classList.toggle('text-red-400', !!telemetryCompareYear);
            sel.classList.toggle('text-gray-300', !telemetryCompareYear);
        }

        // Centralizza la logica di visibilità dei due controlli telemetria,
        // richiamata sia al cambio circuito (updateApp) sia al cambio vista
        // (toggleTelemetryView), così restano sempre coerenti tra loro.
        function updateTelemetryButtonsVisibility() {
            const circuitName = select.value;
            const telemetryBtn = document.getElementById('telemetryToggle');
            const compareSelect = document.getElementById('telemetryCompareSelect');
            const hasTelemetry = !!getTelemetryEntry(telemetryPrimarySeason, circuitName);

            if (telemetryBtn) telemetryBtn.classList.toggle('hidden', !hasTelemetry);
            if (!hasTelemetry && chartViewMode === 'telemetry') {
                chartViewMode = 'line';
                updateTelemetryToggleLabel();
            }

            // Tutte le stagioni con dati per questo circuito, esclusa quella
            // primaria - più recenti prima, così le prime opzioni del select
            // sono quelle più probabilmente interessanti da confrontare.
            const availableYears = telemetryData && telemetryData.seasons
                ? Object.keys(telemetryData.seasons)
                    .filter(season => season !== telemetryPrimarySeason && getTelemetryEntry(season, circuitName))
                    .sort((a, b) => b.localeCompare(a))
                : [];

            const showCompareSelect = hasTelemetry && availableYears.length > 0 && chartViewMode === 'telemetry';
            if (compareSelect) {
                compareSelect.classList.toggle('hidden', !showCompareSelect);
                if (showCompareSelect) {
                    // Mantiene la stagione già scelta se ancora disponibile
                    // per il nuovo circuito, altrimenti torna a "nessuna".
                    if (!availableYears.includes(telemetryCompareYear)) telemetryCompareYear = null;
                    compareSelect.innerHTML = `<option value="">vs...</option>` +
                        availableYears.map(y => `<option value="${y}">vs ${y}</option>`).join('');
                    compareSelect.value = telemetryCompareYear || '';
                    updateTelemetryCompareSelectStyle();
                }
            }
            if (!showCompareSelect && telemetryCompareYear) {
                telemetryCompareYear = null;
                updateTelemetryCompareSelectStyle();
            }
        }

        function toggleTelemetryView() {
            chartViewMode = chartViewMode === 'telemetry' ? 'line' : 'telemetry';
            updateTelemetryToggleLabel();
            updateTelemetryButtonsVisibility();
            updateActiveYearCardHighlight();
            syncUrlState();
            // Stessa dissolvenza usata dal toggle linea/delta, per coerenza.
            chartContainer.style.opacity = '0';
            setTimeout(() => {
                renderChart();
                chartContainer.style.opacity = '1';
            }, 200);
        }

        // Evidenzia i box "Anno YYYY" coinvolti nel grafico Telemetria, con
        // gli stessi colori/tratti usati lì: bordo pieno rosso per l'anno
        // principale, bordo tratteggiato blu per l'anno di confronto (se
        // scelto) - stessa combinazione delle due tracce sul grafico, così è
        // chiaro a colpo d'occhio quali due anni si stanno confrontando.
        // Nessun box evidenziato se non si è in vista Telemetria.
        function updateActiveYearCardHighlight() {
            document.querySelectorAll('#detailsList > div[data-year]').forEach(card => {
                const isPrimary = chartViewMode === 'telemetry' && card.dataset.year === telemetryPrimarySeason;
                const isCompare = chartViewMode === 'telemetry' && !!telemetryCompareYear && card.dataset.year === telemetryCompareYear;
                card.classList.toggle('ring-2', isPrimary);
                card.classList.toggle('ring-[#E10600]', isPrimary);
                card.classList.toggle('outline', isCompare);
                card.classList.toggle('outline-2', isCompare);
                card.classList.toggle('outline-dashed', isCompare);
                card.classList.toggle('outline-[#3b82f6]', isCompare);
                card.classList.toggle('outline-offset-2', isCompare);
            });
        }

        function onTelemetryCompareChange() {
            const sel = document.getElementById('telemetryCompareSelect');
            telemetryCompareYear = sel.value || null;
            updateTelemetryCompareSelectStyle();
            updateActiveYearCardHighlight();
            syncUrlState();
            renderTelemetryCharts();
        }

        // Cliccando un box "Dettagli Qualifiche" con telemetria disponibile
        // (vedi updateApp): apre la vista Telemetria mostrando il giro di
        // QUELL'anno specifico come principale, non il default 2026.
        // Nessun confronto preimpostato: parte come vista singola pulita,
        // l'utente può poi scegliere un confronto dal select "vs...".
        function showTelemetryForYear(year) {
            const circuitName = select.value;
            if (!getTelemetryEntry(String(year), circuitName)) return;
            telemetryPrimarySeason = String(year);
            telemetryCompareYear = null;
            chartViewMode = 'telemetry';
            updateTelemetryToggleLabel();
            updateTelemetryButtonsVisibility();
            updateActiveYearCardHighlight();
            syncUrlState();
            chartContainer.style.opacity = '0';
            setTimeout(() => {
                renderChart();
                chartContainer.style.opacity = '1';
            }, 200);
            chartCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Tabella compatta con posizione/pilota/scuderia non serve qui: la
        // telemetria è di un solo pilota (il poleman) per circuito. Quando
        // il confronto è attivo, sovrapponiamo il giro di pole 2025 solo sui
        // grafici Velocità e Marcia (Acceleratore/Freno resta a 4 tracce
        // sovrapposte sarebbe illeggibile, quindi mostra solo il 2026).
        // --- STATISTICHE DEL GIRO (riquadri sotto la telemetria) ----------
        // A riposo: velocità minima e massima, % del giro a gas pieno, secondi
        // in frenata. Passando col mouse/dito sui grafici: velocità, marcia,
        // acceleratore e freno nel punto indicato. Rosso = giro principale,
        // blu = giro di confronto, come le curve.
        const STAT_COLOR_PRIMARY = '#E10600';
        const STAT_COLOR_COMPARE = '#3b82f6';
        let telemetryStatsCtx = null; // { entries: [{entry, stats}], lastKey }

        // Riassunto di un giro. Medie pesate sul tempo (i campioni non sono
        // equidistanti) e solo sui tratti con dati validi: i buchi della
        // fonte (dropout OpenF1) non falsano le percentuali.
        function computeLapStats(entry) {
            const speeds = entry.samples.map(s => s.speed).filter(v => typeof v === 'number');
            let throttleTime = 0, fullTime = 0, brakeTime = 0;
            for (let i = 0; i < entry.samples.length - 1; i++) {
                const a = entry.samples[i];
                const dt = entry.samples[i + 1].t - a.t;
                if (typeof a.throttle !== 'number' || dt <= 0) continue;
                throttleTime += dt;
                if (a.throttle >= 98) fullTime += dt;
                if (typeof a.brake === 'number' && a.brake > 0) brakeTime += dt;
            }
            return {
                vmin: speeds.length ? Math.min(...speeds) : null,
                vmax: speeds.length ? Math.max(...speeds) : null,
                fullPct: throttleTime > 0 ? Math.round(100 * fullTime / throttleTime) : null,
                brakeSec: throttleTime > 0 ? brakeTime : null,
            };
        }

        // Campione più vicino all'istante t (ricerca binaria: i campioni sono
        // ordinati per tempo).
        function sampleAt(entry, t) {
            const s = entry.samples;
            if (!s.length || t < s[0].t - 0.5 || t > s[s.length - 1].t + 0.5) return null;
            let lo = 0, hi = s.length - 1;
            while (hi - lo > 1) {
                const mid = (lo + hi) >> 1;
                if (s[mid].t <= t) lo = mid; else hi = mid;
            }
            return Math.abs(s[lo].t - t) <= Math.abs(s[hi].t - t) ? s[lo] : s[hi];
        }

        const fmtDec = (v, d = 1) => v.toFixed(d).replace('.', ',');

        // hoverT = secondo del giro sotto il puntatore, o null a riposo.
        function renderTelemetryStats(hoverT = null) {
            const ctx = telemetryStatsCtx;
            const grid = document.getElementById('telemetryStatsGrid');
            const header = document.getElementById('telemetryStatsHeader');
            if (!ctx || !grid) return;

            let boxes;
            if (hoverT === null) {
                boxes = [
                    ['Velocità min', ctx.entries.map(e => e.stats.vmin === null ? '—' : `${e.stats.vmin} km/h`)],
                    ['Velocità max', ctx.entries.map(e => e.stats.vmax === null ? '—' : `${e.stats.vmax} km/h`)],
                    ['Gas pieno', ctx.entries.map(e => e.stats.fullPct === null ? '—' : `${e.stats.fullPct}% del giro`)],
                    ['In frenata', ctx.entries.map(e => e.stats.brakeSec === null ? '—' : `${fmtDec(e.stats.brakeSec)} s`)],
                ];
            } else {
                const samples = ctx.entries.map(e => sampleAt(e.entry, hoverT));
                // "—" = istante fuori dal giro o tratto senza dati alla fonte.
                const val = (s, f) => (s && f(s) !== null && f(s) !== undefined) ? f(s) : null;
                boxes = [
                    ['Velocità', samples.map(s => { const v = val(s, x => x.speed); return v === null ? '—' : `${v} km/h`; })],
                    ['Marcia', samples.map(s => { const v = val(s, x => x.gear); return v === null ? '—' : `${v}ª`; })],
                    ['Acceleratore', samples.map(s => { const v = val(s, x => x.throttle); return v === null ? '—' : `${v}%`; })],
                    // Il freno in OpenF1 è solo premuto/rilasciato (0 o 100):
                    // una percentuale sembrerebbe misurata senza esserlo.
                    ['Freno', samples.map(s => { const v = val(s, x => x.brake); return v === null ? '—' : (v > 0 ? 'Premuto' : 'Rilasciato'); })],
                ];
            }

            const key = JSON.stringify(boxes);
            if (key === ctx.lastKey) return; // stesso campione: niente da ridisegnare
            ctx.lastKey = key;

            header.innerText = hoverT === null ? 'Riepilogo del giro' : `Valori a ${fmtDec(hoverT)} s del giro`;
            grid.innerHTML = boxes.map(([label, values]) => `
                <div class="bg-gray-900 rounded-lg border border-gray-800 px-3 py-2">
                    <div class="text-[11px] text-gray-400">${label}</div>
                    ${values.map((v, i) => `<div class="${i === 0 ? 'text-sm font-semibold' : 'text-xs'}" style="color:${i === 0 ? STAT_COLOR_PRIMARY : STAT_COLOR_COMPARE}">${v}</div>`).join('')}
                </div>`).join('');
        }

        // Puntatore sui grafici -> secondo del giro. Ascoltatori sul
        // contenitore dei tre pannelli invece dell'onHover di Chart.js, che
        // scatta solo dentro l'area di disegno e mai all'uscita (i riquadri
        // restavano fermi sull'ultimo punto). Le tre aree di disegno hanno lo
        // stesso asse X e sono allineate, quindi basta leggerlo da una.
        function telemetryTimeAtClientX(clientX) {
            const chart = telemetrySpeedChart;
            if (!chart || !chart.chartArea) return null;
            const x = clientX - chart.canvas.getBoundingClientRect().left;
            if (x < chart.chartArea.left || x > chart.chartArea.right) return null;
            return chart.scales.x.getValueForPixel(x);
        }
        (function setupTelemetryStatsPointer() {
            const panels = document.getElementById('telemetryPanels');
            const onMove = (clientX) => renderTelemetryStats(telemetryTimeAtClientX(clientX));
            const reset = () => renderTelemetryStats(null);
            panels.addEventListener('mousemove', e => onMove(e.clientX));
            panels.addEventListener('mouseleave', reset);
            panels.addEventListener('touchstart', e => onMove(e.touches[0].clientX), { passive: true });
            panels.addEventListener('touchmove', e => onMove(e.touches[0].clientX), { passive: true });
            panels.addEventListener('touchend', reset);
            panels.addEventListener('touchcancel', reset);
        })();

        function renderTelemetryCharts() {
            const poleCanvas = document.getElementById('telemetrySpeedChart');
            const tbCanvas = document.getElementById('telemetryThrottleBrakeChart');
            const gearCanvas = document.getElementById('telemetryGearChart');
            if (telemetrySpeedChart) telemetrySpeedChart.destroy();
            if (telemetryThrottleBrakeChart) telemetryThrottleBrakeChart.destroy();
            if (telemetryGearChart) telemetryGearChart.destroy();

            const entry = getTelemetryEntry(telemetryPrimarySeason, select.value);
            const compareEntry = telemetryCompareYear ? getTelemetryEntry(telemetryCompareYear, select.value) : null;
            const caption = document.getElementById('chartCaption');
            if (!entry) {
                // Non dovrebbe succedere (il tasto resta nascosto in questo
                // caso), ma per sicurezza non lasciamo grafici vuoti rotti.
                if (caption) caption.innerText = 'Telemetria non disponibile';
                return;
            }
            // Tratti in cui la telemetria dell'auto si è interrotta alla fonte
            // (OpenF1): campioni senza velocità, mostrati come buchi nei tre
            // grafici. Li segnaliamo a parole per non farli sembrare un bug.
            const dropoutNote = (e, label) => {
                // Raggruppa i campioni consecutivi senza velocità in "tratti".
                const windows = [];
                e.samples.forEach((s, i) => {
                    if (s.speed !== null) return;
                    const prevMissing = i > 0 && e.samples[i - 1].speed === null;
                    if (prevMissing) windows[windows.length - 1].end = s.t;
                    else windows.push({ start: s.t, end: s.t });
                });
                if (windows.length === 0) return '';
                const f = v => v.toFixed(1).replace('.', ',');
                const detail = windows.length === 1
                    ? `tra ${f(windows[0].start)} e ${f(windows[0].end)} s`
                    : `in ${windows.length} tratti (~${f(windows.reduce((sum, w) => sum + (w.end - w.start), 0))} s in totale)`;
                return ` <span class="text-yellow-500" title="La telemetria dell'auto si è interrotta alla fonte (OpenF1): per quei tratti non esistono dati attendibili.">⚠️ ${label}dati OpenF1 assenti ${detail}</span>`;
            };

            if (caption) {
                if (compareEntry) {
                    caption.innerHTML = `<span style="color:#E10600">🏎️ ${escapeHtml(entry.driver)} '${yy(telemetryPrimarySeason)} — ${formatSecondsToTime(entry.lapTime)}</span>`
                        + ` &nbsp;vs&nbsp; <span style="color:#3b82f6">${escapeHtml(compareEntry.driver)} '${yy(telemetryCompareYear)} — ${formatSecondsToTime(compareEntry.lapTime)}</span>`;
                } else {
                    caption.innerText = `🏎️ ${entry.driver} (${entry.team}) — ${formatSecondsToTime(entry.lapTime)}`;
                }
                caption.insertAdjacentHTML('beforeend', dropoutNote(entry, compareEntry ? `${escapeHtml(entry.driver)} '${yy(telemetryPrimarySeason)}: ` : '')
                    + (compareEntry ? dropoutNote(compareEntry, `${escapeHtml(compareEntry.driver)} '${yy(telemetryCompareYear)}: `) : ''));
            }

            const speedPoints = entry.samples.map(s => ({ x: s.t, y: s.speed }));
            // Percentuali non valide (null, o fuori da 0-100 come il 104
            // restituito a volte da OpenF1) diventano buchi nel grafico invece
            // di essere tagliate a 100%.
            const pct = v => (typeof v === 'number' && v >= 0 && v <= 100) ? v : null;
            const throttlePoints = entry.samples.map(s => ({ x: s.t, y: pct(s.throttle) }));
            const brakePoints = entry.samples.map(s => ({ x: s.t, y: pct(s.brake) }));
            const gearPoints = entry.samples.map(s => ({ x: s.t, y: s.gear }));
            const compareSpeedPoints = compareEntry ? compareEntry.samples.map(s => ({ x: s.t, y: s.speed })) : null;
            const compareGearPoints = compareEntry ? compareEntry.samples.map(s => ({ x: s.t, y: s.gear })) : null;

            // Asse X: da 0 alla fine REALE del giro (o del più lungo dei due in
            // confronto), uguale nei tre pannelli. Lasciato in automatico,
            // Chart.js lo arrotondava al "numero tondo" successivo (es. 90 s
            // per un giro da 80,8 s) e la curva finiva molto prima del bordo.
            telemetryStatsCtx = {
                entries: [entry, compareEntry].filter(Boolean).map(e => ({ entry: e, stats: computeLapStats(e) })),
                lastKey: null,
            };
            renderTelemetryStats(null);

            const lastT = pts => (pts && pts.length) ? pts[pts.length - 1].x : 0;
            const xMax = Math.max(lastT(speedPoints), lastT(compareSpeedPoints));
            const xScaleRange = { min: 0, max: xMax };

            // Telefono verticale: asse Y stretto (numeri senza "km/h", font più
            // piccolo) e meno margine a destra, per allargare le curve.
            const compactAxis = isCompactTelemetryAxis();
            const tickFont = compactAxis ? { size: 10 } : undefined;

            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                resizeDelay: 200,
                animation: { duration: 400 },
                interaction: { mode: 'index', intersect: false },
                // Padding destro uguale e sufficiente per l'etichetta "90s"
                // dell'asse X (visibile solo nel grafico marce): senza, Chart.js
                // restringe di ~12px l'area di disegno di quel solo pannello e
                // la curva delle marce finisce prima delle altre due.
                layout: { padding: { right: compactAxis ? 10 : 20 } },
            };

            // I tre grafici hanno etichette sull'asse Y di larghezza diversa
            // ("350 km/h" vs "100%" vs "5"): Chart.js dimensiona ogni asse
            // in base al proprio contenuto, quindi senza questo fix le aree
            // di disegno (e con esse l'inizio del giro, t=0) non partirebbero
            // allineate verticalmente tra i tre pannelli. Forzando la stessa
            // larghezza fissa su tutti e tre, i tre assi X restano allineati.
            const Y_AXIS_WIDTH = compactAxis ? 36 : 70;
            const fixedYAxisWidth = { afterFit: scale => { scale.width = Y_AXIS_WIDTH; } };

            const speedDatasets = [
                { label: `${entry.driver} '${yy(telemetryPrimarySeason)}`, data: speedPoints, borderColor: '#E10600', borderWidth: 2, pointRadius: 0, tension: 0.15 }
            ];
            if (compareEntry) {
                speedDatasets.push({ label: `${compareEntry.driver} '${yy(telemetryCompareYear)}`, data: compareSpeedPoints, borderColor: '#3b82f6', borderWidth: 2, pointRadius: 0, tension: 0.15, borderDash: [5, 3] });
            }

            telemetrySpeedChart = new Chart(poleCanvas.getContext('2d'), {
                type: 'line',
                data: { datasets: speedDatasets },
                options: {
                    ...commonOptions,
                    scales: {
                        x: { type: 'linear', ...xScaleRange, grid: { display: false }, ticks: { display: false } },
                        y: { ...fixedYAxisWidth, grid: { color: '#2a2a2a' }, ticks: { color: '#a0aec0', font: tickFont, callback: v => compactAxis ? v : v + ' km/h' } }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: c => ' ' + (compareEntry ? c.dataset.label : 'Velocità') + ': ' + c.parsed.y + ' km/h' } }
                    }
                }
            });

            telemetryThrottleBrakeChart = new Chart(tbCanvas.getContext('2d'), {
                type: 'line',
                data: {
                    datasets: [
                        { label: 'Acceleratore', data: throttlePoints, borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,0.3)', borderWidth: 1, pointRadius: 0, fill: true, tension: 0 },
                        { label: 'Freno', data: brakePoints, borderColor: '#E10600', backgroundColor: 'rgba(225,6,0,0.3)', borderWidth: 1, pointRadius: 0, fill: true, stepped: true }
                    ]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        x: { type: 'linear', ...xScaleRange, grid: { display: false }, ticks: { display: false } },
                        y: { ...fixedYAxisWidth, min: 0, max: 100, grid: { color: '#2a2a2a' }, ticks: { color: '#a0aec0', font: tickFont, callback: v => v + '%' } }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + c.parsed.y + '%' } }
                    }
                }
            });

            const gearDatasets = [
                { label: `${entry.driver} '${yy(telemetryPrimarySeason)}`, data: gearPoints, borderColor: '#a0aec0', borderWidth: 1.5, pointRadius: 0, stepped: true }
            ];
            if (compareEntry) {
                gearDatasets.push({ label: `${compareEntry.driver} '${yy(telemetryCompareYear)}`, data: compareGearPoints, borderColor: '#3b82f6', borderWidth: 1.5, pointRadius: 0, stepped: true, borderDash: [5, 3] });
            }

            telemetryGearChart = new Chart(gearCanvas.getContext('2d'), {
                type: 'line',
                data: { datasets: gearDatasets },
                options: {
                    ...commonOptions,
                    scales: {
                        x: { type: 'linear', ...xScaleRange, grid: { display: false }, ticks: { color: '#a0aec0', font: tickFont, maxRotation: 0, callback: v => v.toFixed(0) + 's' } },
                        y: { ...fixedYAxisWidth, min: 1, max: 8, grid: { color: '#2a2a2a' }, ticks: { color: '#a0aec0', font: tickFont, stepSize: 1 } }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: c => ' ' + (compareEntry ? c.dataset.label : 'Marcia') + ': ' + c.parsed.y } }
                    }
                }
            });
        }

        // Un file di stato per automazione (status/{key}.json), scritto dal
        // rispettivo script GitHub Action ad ogni esecuzione (successo o
        // errore) - vedi scripts/lib/status.js. Il feed news è escluso di
        // proposito: non riguarda le pole/telemetria/classifica/calendario
        // che questo indicatore riassume.
        const API_STATUS_SOURCES = [
            { key: 'poles', label: 'Pole position' },
            { key: 'penalty', label: 'Penalità pole' },
            { key: 'standings', label: 'Classifica' },
            { key: 'calendar', label: 'Calendario' },
            { key: 'history', label: 'Storico stagioni' },
            { key: 'telemetry', label: 'Telemetria' },
        ];

        async function updateApiHealthBadge() {
            if (!dataSourceBadge) return;
            const results = await Promise.all(API_STATUS_SOURCES.map(async src => {
                try {
                    const res = await fetch(`status/${src.key}.json`, { cache: 'no-cache' });
                    if (!res.ok) return { ...src, ok: false, error: 'file di stato non trovato' };
                    const data = await res.json();
                    return { ...src, ok: !!data.ok, error: data.error, lastRun: data.lastRun };
                } catch (err) {
                    return { ...src, ok: false, error: 'file di stato non raggiungibile' };
                }
            }));

            const failing = results.filter(r => !r.ok);
            if (failing.length === 0) {
                // Mostriamo la più vecchia delle 5 ultime esecuzioni riuscite:
                // è il momento fino al quale possiamo dire con certezza che
                // TUTTE le automazioni erano confermate funzionanti.
                const oldestRun = results.reduce((oldest, r) => {
                    const t = new Date(r.lastRun).getTime();
                    return (oldest === null || t < oldest) ? t : oldest;
                }, null);
                const d = new Date(oldestRun);
                const dateStr = `${d.getDate()} ${ITALIAN_MONTHS[d.getMonth()].toLowerCase()}`;
                const timeStr = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome' });
                dataSourceBadge.innerText = `🟢 Dati aggiornati al ${dateStr} alle ${timeStr}. API correttamente funzionanti.`;
                dataSourceBadge.title = '';
            } else {
                const names = failing.map(f => f.label).join(', ');
                dataSourceBadge.innerText = `🔴 ${names}: aggiornamento non riuscito.`;
                dataSourceBadge.title = failing.map(f => `${f.label}: ${f.error || 'errore sconosciuto'}`).join(' | ');
            }
        }

        function populateCircuitSelectors(circuits) {
            select.innerHTML = '';
            circuits.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.innerText = c;
                select.appendChild(opt);
            });
        }

        async function initApp() {
            try {
                const response = await fetch('data.json', { cache: 'no-cache' });
                if(!response.ok) throw new Error('data.json non raggiungibile (status ' + response.status + ')');
                baseData = await response.json();
                if(dataSourceBadge) dataSourceBadge.innerText = '⏳ Verifica stato API...';
            } catch(err) {
                // Probabile apertura del file in locale (file://) oppure data.json assente.
                console.error('Impossibile caricare data.json:', err);
                if(dataSourceBadge) dataSourceBadge.innerText = '🔴 Errore: data.json non raggiungibile';
                detailsList.innerHTML = `
                    <div class="bg-[#1E1E1E] border border-red-800 rounded-xl p-4 text-sm text-gray-300">
                        <p class="font-bold text-red-500 mb-1">⚠️ Impossibile caricare i dati</p>
                        <p>Il file <code>data.json</code> non è raggiungibile. Se hai aperto questo file in locale con doppio click, servilo tramite un server HTTP oppure visita il sito pubblicato online.</p>
                    </div>`;
                return;
            }

            poleData = [...baseData];

            // Tutte le altre risorse partono insieme (prima erano 7 richieste
            // in fila: con la latenza di rete reale ognuna aggiungeva un
            // intero viaggio prima del primo render). Un file mancante non
            // blocca gli altri: ognuno degrada da solo, come prima.
            const loadJson = async (url) => {
                try {
                    const res = await fetch(url, { cache: 'no-cache' });
                    return res.ok ? await res.json() : null;
                } catch (err) {
                    console.warn(`Impossibile caricare ${url}:`, err);
                    return null;
                }
            };
            const [standings, calendar, telemetry, news, historyIndex] = await Promise.all([
                loadJson('standings.json'),
                loadJson('calendar.json'),
                loadJson('telemetry.json'),
                loadJson('news.json'),
                loadJson('history/index.json'),
                updateApiHealthBadge(),
            ]);

            standingsData = standings;
            telemetryData = telemetry;
            newsData = news;

            if (calendar) {
                calendarData = calendar;
                const calendarButtonLabel = document.getElementById('calendarButtonLabel');
                if (calendarButtonLabel) calendarButtonLabel.innerText = `Calendario & Risultati ${calendarData.season}`;
                renderFeaturedRace();
                // Aggiorna lo stato "live"/"passata"/"da disputare" delle
                // sessioni ogni minuto, senza bisogno di ricaricare la pagina.
                setInterval(renderFeaturedRace, 60000);
            }

            if (historyIndex && Array.isArray(historyIndex.years) && historyIndex.years.length > 0) {
                PREVIOUS_YEARS = historyIndex.years;
            }

            const uniqueCircuits = [...new Set(poleData.map(d => d.circuit))].sort();
            populateCircuitSelectors(uniqueCircuits);

            select.addEventListener('change', (e) => updateApp(e.target.value));

            // Circuito e vista iniziali: quelli di un link condiviso se validi,
            // altrimenti il circuito di default (ultimo GP / weekend in corso).
            const urlState = parseUrlState();
            const defaultCircuit = determineDefaultCircuit();
            const initialCircuit = uniqueCircuits.includes(urlState.circuit) ? urlState.circuit
                : (defaultCircuit && uniqueCircuits.includes(defaultCircuit)) ? defaultCircuit : uniqueCircuits[0];
            select.value = initialCircuit;
            updateChartViewToggleIcon();
            updateApp(initialCircuit, uniqueCircuits.includes(urlState.circuit) ? urlState : null);

            // Hash incollato/modificato a mano nella stessa scheda (replaceState
            // non lo fa scattare, quindi nessun ciclo con syncUrlState).
            window.addEventListener('hashchange', () => {
                if (location.hash === buildUrlHash()) return;
                const state = parseUrlState();
                if (!uniqueCircuits.includes(state.circuit)) { syncUrlState(); return; } // riscrive l'indirizzo con lo stato reale
                select.value = state.circuit;
                updateApp(state.circuit, state);
            });
            applyChartHeight(); // posiziona anche il divisore orizzontale, centrato sul grafico
            applyDetailsColumnWidth();
            applyFeaturedWidgetWidth();
            // In quest'ordine e solo ora: applyFeaturedWidgetWidth() ha
            // appena fissato la larghezza del widget, che può farne
            // ricalcolare l'altezza (il testo si dispone diversamente).
            // Calcolare l'allineamento PRIMA di questo punto userebbe
            // un'altezza del widget non definitiva (bug osservato: un
            // valore corretto al primo giro, sbagliato pochi istanti dopo).
            alignDetailsColumnTop();
            alignChartTop();
        }

        // Data di oggi nel fuso locale dell'utente, "YYYY-MM-DD" (confrontabile
        // come stringa con le date di gara del calendario).
        function localDateStr() {
            const now = new Date();
            return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
        }

        // Circuito da mostrare di default all'apertura del sito: quello
        // dell'ultimo GP disputato, a meno che non sia già iniziato il
        // weekend del prossimo GP (dal venerdì delle prove libere in poi),
        // nel qual caso si mostra quello.
        function determineDefaultCircuit() {
            if (!calendarData) return null;
            const todayStr = localDateStr();

            const currentWeekend = calendarData.races.find(r => r.weekendStart && r.date && r.weekendStart <= todayStr && todayStr <= r.date);
            if (currentWeekend) return currentWeekend.circuit;

            const pastRaces = calendarData.races
                .filter(r => r.date && r.date <= todayStr)
                .sort((a, b) => b.date.localeCompare(a.date));
            return pastRaces.length > 0 ? pastRaces[0].circuit : null;
        }

        // --- DIVISORE TRASCINABILE (solo desktop) tra grafico e dettagli ---
        const mainGrid = document.getElementById('mainGrid');
        const resizeHandle = document.getElementById('resizeHandle');
        const MIN_RATIO = 0.3, MAX_RATIO = 0.78;
        const DEFAULT_LEFT_RATIO = 2 / 3; // larghezza "di default" del grafico, fissa
        let leftRatio = DEFAULT_LEFT_RATIO; // deve combaciare con "2fr 12px 1fr" di partenza

        function applyGridColumns() {
            const leftPct = (leftRatio * 100).toFixed(2);
            const rightPct = ((1 - leftRatio) * 100).toFixed(2);
            mainGrid.style.gridTemplateColumns = `${leftPct}% 12px ${rightPct}%`;
            applyDetailsColumnWidth();
            scheduleReposition();
        }

        // Il pannello Classifica ha una larghezza FISSA pari al 2/3 di default
        // del grafico, indipendente da un eventuale ridimensionamento live del
        // grafico stesso (leftRatio può cambiare col drag, DEFAULT_LEFT_RATIO no).
        const classificaPanel = document.getElementById('classificaPanel');
        function applyClassificaPanelWidth() {
            if (!isDesktopLayout()) {
                classificaPanel.style.width = '';
                return;
            }
            const totalWidth = mainGrid.getBoundingClientRect().width;
            const width = (totalWidth - 12) * DEFAULT_LEFT_RATIO;
            classificaPanel.style.width = width + 'px';
        }

        // La colonna "Dettagli Qualifiche" ha una larghezza massima FISSA pari
        // al 2/3 di default del grafico (stessa base della classifica): il
        // drag della maniglia può solo restringerla (se il grafico si allarga
        // oltre il default), mai allargarla oltre il default. Ancorata al
        // bordo destro con margin-left:auto, così la sua posizione non
        // dipende mai da leftRatio e non si sovrappone mai al pannello
        // Classifica quando il grafico si restringe.
        const detailsColumn = document.getElementById('detailsColumn');
        function applyDetailsColumnWidth() {
            if (!isDesktopLayout()) {
                detailsColumn.style.width = '';
                detailsColumn.style.marginLeft = '';
                return;
            }
            const totalWidth = mainGrid.getBoundingClientRect().width;
            const defaultWidth = (totalWidth - 12) * (1 - DEFAULT_LEFT_RATIO);
            const liveWidth = (totalWidth - 12) * (1 - leftRatio);
            detailsColumn.style.width = Math.min(defaultWidth, liveWidth) + 'px';
            detailsColumn.style.marginLeft = 'auto';
        }

        // Il riquadro "Prossimo GP" nell'header deve avere la stessa
        // larghezza (di default, non quella live trascinabile) dei riquadri
        // di "Dettagli Qualifiche" - vive in un contenitore diverso
        // (l'header, non mainGrid) quindi va calcolata a parte con la
        // stessa formula usata per detailsColumn.
        const featuredRaceWidgetDesktop = document.getElementById('featuredRaceWidgetDesktop');
        function applyFeaturedWidgetWidth() {
            if (!isDesktopLayout()) {
                featuredRaceWidgetDesktop.style.width = '';
                featuredRaceWidgetDesktop.style.marginRight = '';
                return;
            }
            // Copia larghezza e bordo destro REALI di detailsColumn (misurati,
            // non ricalcolati con la stessa formula): detailsColumn vive
            // dentro mainGrid, la cui griglia (colonne percentuali + gap-4)
            // trabocca oltre il bordo destro di mainGrid stesso di una
            // quantità fissa (l'handle da 12px + i due gap da 16px = 44px),
            // quindi calcolare la larghezza con la stessa formula ma
            // ancorarla nell'header (un contenitore diverso, senza lo stesso
            // "trabocco") lasciava il riquadro spostato di quei 44px rispetto
            // ai riquadri di "Dettagli Qualifiche". Misurando direttamente
            // detailsColumn il risultato resta corretto anche se gap/misure
            // cambiassero in futuro.
            const detailsRect = detailsColumn.getBoundingClientRect();
            const parentRect = featuredRaceWidgetDesktop.parentElement.getBoundingClientRect();
            featuredRaceWidgetDesktop.style.width = detailsRect.width + 'px';
            featuredRaceWidgetDesktop.style.marginRight = (parentRect.right - detailsRect.right) + 'px';
        }

        let dragging = false;
        resizeHandle.addEventListener('mousedown', (e) => {
            dragging = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            const rect = mainGrid.getBoundingClientRect();
            let ratio = (e.clientX - rect.left) / rect.width;
            leftRatio = Math.min(MAX_RATIO, Math.max(MIN_RATIO, ratio));
            applyGridColumns();
        });
        window.addEventListener('mouseup', () => {
            if (!dragging) return;
            dragging = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });

        // --- DIVISORE TRASCINABILE (solo desktop) per l'altezza del grafico ---
        const chartContainer = document.getElementById('chartContainer');
        const vResizeHandle = document.getElementById('vResizeHandle');
        const leftColumn = document.getElementById('leftColumn');
        const chartCard = document.getElementById('chartCard');
        const MIN_CHART_HEIGHT = 200, MAX_CHART_HEIGHT = 700;
        let chartHeight = 440; // deve combaciare con "md:h-[440px]" di partenza

        // Le due maniglie devono restare ancorate all'area di disegno REALE
        // del grafico (gli assi X/Y calcolati da Chart.js), non al bordo
        // della card (che include padding/etichetta) né tantomeno alla
        // colonna dei dettagli qualifiche. chartArea è la zona di plot vera
        // e propria, esclusi assi ed etichette.
        function getChartAreaRect() {
            if (!currentChart || !currentChart.chartArea) return null;
            const canvasRect = document.getElementById('poleChart').getBoundingClientRect();
            const a = currentChart.chartArea;
            return {
                top: canvasRect.top + a.top,
                bottom: canvasRect.top + a.bottom,
                left: canvasRect.left + a.left,
                right: canvasRect.left + a.right,
            };
        }

        // Maniglia larghezza (verticale): centrata sull'asse Y del grafico.
        // Il pallino interno è posizionato con "top" assoluto (non margin-top):
        // un margin-top sull'elemento sticky ne altererebbe anche la soglia di
        // aggancio dello scroll, facendolo restare "sticky" in un momento
        // diverso rispetto alla colonna del grafico (bug osservato scorrendo
        // la pagina). Con "top" assoluto sul figlio, l'elemento sticky esterno
        // non ha margini e resta perfettamente sincronizzato con leftColumn.
        function positionResizeHandle() {
            if (!isDesktopLayout()) return;
            // L'altezza "naturale" di resizeHandle deve combaciare con quella
            // di leftColumn (non con l'intera riga della griglia, che segue
            // anche la colonna dei dettagli molto più alta): altrimenti i due
            // elementi "sticky" si sganciano dallo scroll in punti diversi.
            resizeHandle.style.height = leftColumn.offsetHeight + 'px';
            const handleRect = resizeHandle.getBoundingClientRect();
            const pill = resizeHandle.firstElementChild;
            const area = getChartAreaRect();
            let centerY;
            if (area) {
                centerY = (area.top + area.bottom) / 2 - handleRect.top;
            } else {
                // Il grafico non è ancora pronto: fallback sul centro della card.
                const cardRect = chartCard.getBoundingClientRect();
                centerY = (cardRect.top - handleRect.top) + cardRect.height / 2;
            }
            pill.style.top = Math.max(0, centerY - pill.offsetHeight / 2) + 'px';
        }

        // Maniglia altezza (orizzontale): centrata sull'asse X del grafico.
        function positionVResizeHandle() {
            if (!isDesktopLayout()) return;
            const area = getChartAreaRect();
            if (!area) return;
            const handleRect = vResizeHandle.getBoundingClientRect();
            const pill = vResizeHandle.firstElementChild;
            const centerX = (area.left + area.right) / 2 - handleRect.left;
            pill.style.marginLeft = Math.max(0, centerX - pill.offsetWidth / 2) + 'px';
        }

        function repositionHandles() {
            positionResizeHandle();
            positionVResizeHandle();
        }

        // Chart.js si ridimensiona già da solo (ResizeObserver sul contenitore)
        // quando cambiano le dimensioni della card: chiamare chart.resize() a
        // mano qui interferisce con quel meccanismo e può azzerare la
        // larghezza del canvas. Si aspetta invece che Chart.js finisca il suo
        // resize automatico prima di leggere chartArea aggiornata (setTimeout
        // invece di requestAnimationFrame, che si è rivelato inaffidabile in
        // alcuni ambienti di test).
        function scheduleReposition() {
            // Riposiziona subito (sincrono): l'altezza di leftColumn è già
            // nota non appena cambia il DOM (es. apertura/chiusura pannelli),
            // e aspettare solo i 50ms sotto lascerebbe la maniglia sbagliata
            // (altezza vecchia) visibile per un istante, con un salto brusco
            // quando poi scatta alla misura giusta. Il setTimeout resta per
            // catturare l'assestamento asincrono di Chart.js (il suo resize
            // interno, che invece richiede tempo).
            repositionHandles();
            setTimeout(repositionHandles, 50);
        }

        // Altezza del contenitore dei grafici, calcolata in un solo punto:
        // - desktop: quella trascinata col divisore (chartHeight);
        // - telefono ruotato: quasi tutto lo schermo, così i tre grafici della
        //   telemetria si vedono interi senza scorrere;
        // - telefono verticale: 380px in telemetria (3 pannelli), altrimenti
        //   quella del CSS (200px).
        // Prima ogni evento resize (anche la barra di Safari che si nasconde
        // scorrendo) riportava la telemetria su mobile a 200px.
        function chartContainerHeight() {
            if (isDesktopLayout()) return chartHeight + 'px';
            if (isPhoneLandscape()) return Math.max(220, window.innerHeight - 64) + 'px';
            return chartViewMode === 'telemetry' ? '380px' : '';
        }

        function applyChartHeight() {
            chartContainer.style.height = chartContainerHeight();
            scheduleReposition();
        }

        // Allinea il bordo superiore del grafico a quello del primo riquadro
        // di "Dettagli Qualifiche": il selettore circuito sopra il grafico è
        // più alto (label + select) della sola intestazione "Dettagli
        // Qualifiche" sopra il primo riquadro, quindi di default il grafico
        // parte più in basso. Calcolato a runtime (non un valore fisso)
        // perché l'altezza del primo riquadro varia da circuito a circuito
        // (una entry con penaltyNote ha una riga in più).
        function alignChartTop() {
            if (!isDesktopLayout()) {
                chartCard.style.marginTop = '';
                return;
            }
            chartCard.style.marginTop = '0px';
            const firstDetailCard = detailsList.firstElementChild;
            if (!firstDetailCard) return;
            const naturalTop = chartCard.getBoundingClientRect().top;
            const targetTop = firstDetailCard.getBoundingClientRect().top;
            // Il selettore circuito (label + select) sopra il grafico è più
            // alto dell'intestazione "Dettagli Qualifiche" sopra il primo
            // riquadro: allineare del tutto i due bordi superiori
            // spingerebbe il grafico dentro lo spazio del selettore
            // (sovrapposizione segnalata dall'utente). Non si sale mai più
            // in alto del bordo inferiore del selettore (+8px di margine
            // minimo): l'allineamento è quindi "il più vicino possibile
            // senza sovrapporsi", non necessariamente perfetto.
            const selectorBottom = select.closest('div').getBoundingClientRect().bottom;
            const minTop = selectorBottom + 8;
            const desiredTop = Math.max(targetTop, minTop);
            const delta = desiredTop - naturalTop;
            chartCard.style.marginTop = delta + 'px';
        }

        // Il widget "Prossimo GP" (in alto a destra, ancorato al titolo) è
        // più corto del titolo+selettore a sinistra, quindi sotto di lui
        // restava uno spazio vuoto ben visibile prima che iniziasse
        // "Dettagli Qualifiche" (segnalato dall'utente). Si tira su
        // detailsColumn di conseguenza, mai più in basso della sua
        // posizione naturale (solo per "chiudere" lo spazio in eccesso, non
        // per spingere i dettagli più giù del normale).
        function alignDetailsColumnTop() {
            if (!isDesktopLayout()) {
                detailsColumn.style.marginTop = '';
                return;
            }
            detailsColumn.style.marginTop = '0px';
            const widget = document.getElementById('featuredRaceWidgetDesktop');
            if (!widget || !widget.firstElementChild) {
                detailsColumn.style.marginTop = '';
                return;
            }
            const naturalTop = detailsColumn.getBoundingClientRect().top;
            const targetTop = widget.getBoundingClientRect().bottom + 8;
            const delta = Math.min(targetTop - naturalTop, 0);
            detailsColumn.style.marginTop = delta + 'px';
        }
        // Un solo handler di resize, al massimo una volta per frame: prima
        // c'erano 5 listener separati che leggevano e scrivevano il layout
        // ognuno per conto suo a ogni evento (decine al secondo durante un
        // ridimensionamento). L'ordine conta: le larghezze prima (le
        // allineamenti dipendono da esse), detailsColumn già riposizionato
        // prima che alignChartTop() ne legga il primo riquadro, e l'altezza
        // del grafico per ultima.
        let resizeFramePending = false;
        window.addEventListener('resize', () => {
            if (resizeFramePending) return;
            resizeFramePending = true;
            requestAnimationFrame(() => {
                resizeFramePending = false;
                applyLayoutMode();
                applyClassificaPanelWidth();
                applyDetailsColumnWidth();
                applyFeaturedWidgetWidth();
                alignDetailsColumnTop();
                alignChartTop();
                applyChartHeight();
                // Rotazione del telefono / cambio di layout: la telemetria va
                // ricreata (asse Y compatto o no, altezze diverse). Non a ogni
                // resize: solo quando il tipo di layout cambia davvero.
                const layoutKey = `${isDesktopLayout()}|${isPhoneLandscape()}|${isCompactTelemetryAxis()}`;
                if (layoutKey !== lastLayoutKey) {
                    lastLayoutKey = layoutKey;
                    if (chartViewMode === 'telemetry') renderChart();
                }
            });
        });
        let lastLayoutKey = `${isDesktopLayout()}|${isPhoneLandscape()}|${isCompactTelemetryAxis()}`;

        let vDragging = false, vStartY = 0, vStartHeight = chartHeight;
        vResizeHandle.addEventListener('mousedown', (e) => {
            vDragging = true;
            vStartY = e.clientY;
            vStartHeight = chartHeight;
            document.body.style.cursor = 'row-resize';
            document.body.style.userSelect = 'none';
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (!vDragging) return;
            const delta = e.clientY - vStartY;
            chartHeight = Math.min(MAX_CHART_HEIGHT, Math.max(MIN_CHART_HEIGHT, vStartHeight + delta));
            applyChartHeight();
        });
        window.addEventListener('mouseup', () => {
            if (!vDragging) return;
            vDragging = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
        });

        function formatSecondsToTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = Math.floor(totalSeconds % 60);
            const ms = Math.round((totalSeconds % 1) * 1000);
            return mins + ':' + secs.toString().padStart(2, '0') + '.' + ms.toString().padStart(3, '0');
        }

        // --- VISTA CLASSIFICA ---
        async function toggleClassificaPanel() {
            const panel = document.getElementById('classificaPanel');
            const wasHidden = panel.classList.contains('hidden');
            // I quattro pannelli sono mutuamente esclusivi: aprirne uno chiude gli altri.
            document.getElementById('calendarPanel').classList.add('hidden');
            document.getElementById('previousYearsPanel').classList.add('hidden');
            document.getElementById('newsPanel').classList.add('hidden');
            if (wasHidden) {
                // Stessa dissolvenza in apertura usata per gli altri
                // pannelli (Calendario, Stagioni precedenti, News): coerenza
                // tra tutti i tasti, come richiesto esplicitamente.
                panel.classList.remove('hidden');
                await fadeSwap(panel, () => {
                    renderClassifica();
                    applyClassificaPanelWidth();
                });
            } else {
                panel.classList.add('hidden');
            }
            scheduleReposition(); // l'altezza di leftColumn è cambiata
        }

        function renderClassifica() {
            const driverRanking = document.getElementById('driverRanking');
            const teamRanking = document.getElementById('teamRanking');
            const classificaMeta = document.getElementById('classificaMeta');

            if (!standingsData) {
                driverRanking.innerHTML = '';
                teamRanking.innerHTML = '';
