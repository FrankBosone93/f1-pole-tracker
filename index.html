                classificaMeta.innerText = '⚠️ Classifica non disponibile (standings.json non raggiungibile).';
                return;
            }

            const medal = (i) => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;

            document.getElementById('driverRankingTitle').innerText = `🏆 Classifica Piloti ${standingsData.season}`;
            document.getElementById('teamRankingTitle').innerText = `🏆 Classifica Costruttori ${standingsData.season}`;

            driverRanking.innerHTML = standingsData.drivers.map((d, i) => `
                <div class="flex justify-between items-center bg-gray-900 rounded px-3 py-1.5">
                    <span>${medal(i)} ${escapeHtml(d.driver)} <span class="text-gray-500">(${escapeHtml(d.team)})</span></span>
                    <span class="font-bold text-[#E10600]">${d.points} pt</span>
                </div>
            `).join('');

            teamRanking.innerHTML = standingsData.constructors.map((c, i) => `
                <div class="flex justify-between items-center bg-gray-900 rounded px-3 py-1.5">
                    <span>${medal(i)} ${escapeHtml(c.team)}</span>
                    <span class="font-bold text-[#E10600]">${c.points} pt</span>
                </div>
            `).join('');

            const updatedDate = new Date(standingsData.updatedAt).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
            classificaMeta.innerText = `Aggiornato al ${updatedDate}`;
        }

        async function toggleCalendarPanel() {
            const panel = document.getElementById('calendarPanel');
            const wasHidden = panel.classList.contains('hidden');
            // I quattro pannelli sono mutuamente esclusivi: aprirne uno chiude gli altri.
            document.getElementById('classificaPanel').classList.add('hidden');
            document.getElementById('previousYearsPanel').classList.add('hidden');
            document.getElementById('newsPanel').classList.add('hidden');
            if (wasHidden) {
                // Stessa dissolvenza in apertura usata per gli altri
                // pannelli (Classifica, Stagioni precedenti, News).
                panel.classList.remove('hidden');
                await fadeSwap(panel, () => {
                    renderCalendar();
                });
            } else {
                panel.classList.add('hidden');
            }
            scheduleReposition(); // l'altezza di leftColumn è cambiata
        }

        const ITALIAN_MONTHS = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

        // Formatta l'intervallo del weekend di gara (es. "6-8 Marzo", o
        // "28 Febbraio - 1 Marzo" se il weekend attraversa due mesi). Il
        // suffisso "T00:00:00" forza il parsing come data locale invece che
        // UTC: senza, in alcuni fusi orari la data mostrata potrebbe
        // retrocedere di un giorno (stesso tipo di bug già corretto per il
        // meteo, vedi weather.js).
        function formatRaceDateRange(weekendStart, date) {
            if (!date) return '';
            const end = new Date(date + 'T00:00:00');
            if (!weekendStart || weekendStart === date) {
                return `${end.getDate()} ${ITALIAN_MONTHS[end.getMonth()]}`;
            }
            const start = new Date(weekendStart + 'T00:00:00');
            if (start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear()) {
                return `${start.getDate()}-${end.getDate()} ${ITALIAN_MONTHS[end.getMonth()]}`;
            }
            return `${start.getDate()} ${ITALIAN_MONTHS[start.getMonth()]} - ${end.getDate()} ${ITALIAN_MONTHS[end.getMonth()]}`;
        }

        // Countdown giorni/ore/minuti fino all'orario di partenza della gara
        // (race.schedule.race, UTC). null se la gara è già iniziata/passata
        // (il widget resta sulla stessa gara fino a domenica sera - vedi
        // determineFeaturedRace) - in quel caso non ha senso mostrarlo.
        // Si aggiorna da solo ogni minuto insieme al resto del widget
        // (renderFeaturedRace è già richiamato ogni 60s).
        function formatCountdown(raceStart) {
            const diffMs = raceStart - new Date();
            if (diffMs <= 0) return null;
            const totalMinutes = Math.floor(diffMs / 60000);
            const days = Math.floor(totalMinutes / 1440);
            const hours = Math.floor((totalMinutes % 1440) / 60);
            const minutes = totalMinutes % 60;
            return `${days}g ${hours}h ${minutes}m`;
        }

        const SESSION_LABELS = [
            ['fp1', 'Prove Libere 1'],
            ['fp2', 'Prove Libere 2'],
            ['fp3', 'Prove Libere 3'],
            ['sprintQualy', 'Qualifiche Sprint'],
            ['sprintRace', 'Sprint'],
            ['qualy', 'Qualifiche'],
            ['race', 'Gara'],
        ];

        // Converte data+ora UTC di una sessione (come forniti da f1api.dev,
        // es. {date:"2026-03-06", time:"01:30:00Z"}) nell'orario italiano
        // locale. Intl gestisce da solo il cambio ora legale (CET/CEST) per
        // il fuso "Europe/Rome" - non serve calcolarlo a mano.
        function formatSessionTime(session) {
            if (!session || !session.date || !session.time) return null;
            const d = new Date(`${session.date}T${session.time}`);
            if (isNaN(d)) return null;
            const formatted = d.toLocaleString('it-IT', {
                weekday: 'short', day: 'numeric', month: 'short',
                hour: '2-digit', minute: '2-digit',
                timeZone: 'Europe/Rome',
            });
            return formatted.charAt(0).toUpperCase() + formatted.slice(1);
        }

        // Tabella compatta dei risultati di una sessione (prove libere,
        // qualifiche o gara): posizione, pilota, scuderia, tempo. In gara un
        // ritiro mostra il motivo al posto del distacco.
        function renderResultsTable(results, key) {
            // Nomi, scuderie e motivi di ritiro arrivano dall'API esterna
            // (f1api.dev): escape prima dell'innerHTML, come per le news.
            const rows = results.map(r => {
                const timeCell = r.retired
                    ? `<span class="text-orange-400 italic">${escapeHtml(r.retired)}</span>`
                    : `<span class="text-gray-300">${escapeHtml(r.time || '-')}</span>`;
                return `<tr class="border-t border-gray-800">
                    <td class="py-1 pl-2 pr-1 text-gray-500 text-right">${escapeHtml(String(r.position))}</td>
                    <td class="py-1 px-1 text-gray-100 truncate max-w-[110px]">${escapeHtml(r.driver)}</td>
                    <td class="py-1 px-1 text-gray-500 truncate max-w-[90px]">${escapeHtml(r.team)}</td>
                    <td class="py-1 pl-1 pr-2 text-right whitespace-nowrap">${timeCell}</td>
                </tr>`;
            }).join('');
            return `<div class="mt-1 mb-2 max-h-56 overflow-y-auto rounded border border-gray-800 bg-black/20">
                <table class="w-full text-[11px]"><tbody>${rows}</tbody></table>
            </div>`;
        }

        // Espande/richiude i risultati completi di una singola sessione
        // (prove libere, qualifiche o gara), già disputata. Il contenuto è
        // già renderizzato (non serve richiesta di rete: i dati sono già in
        // calendarData), qui si toglie/aggiunge solo la classe "hidden".
        function toggleSessionResults(panelId) {
            const panel = document.getElementById(panelId);
            if (!panel) return;
            panel.classList.toggle('hidden');
            scheduleReposition(); // l'altezza del contenitore è cambiata
        }

        // Griglia a 3 colonne (pallino, etichetta, orario) condivisa tra il
        // pannello Calendario (una per ogni gara, espandibile) e il widget
        // "Prossimo GP" (una sola gara, sempre visibile): stesso identico
        // comportamento in entrambi i posti, come richiesto esplicitamente.
        // idPrefix rende univoci gli id dei pannelli "Risultati" quando la
        // stessa gara compare in più punti della pagina contemporaneamente
        // (es. widget mobile + widget desktop, entrambi nel DOM).
        // hidePractice: nasconde le righe prove libere (fp1/fp2/fp3). Usato
        // dall'elenco gare della stagione in corso per tutte le gare tranne
        // quella in evidenza (l'ultimo GP disputato/in corso) - le prove
        // libere restano visibili solo lì, su richiesta esplicita. Il widget
        // "Prossimo GP" (che mostra sempre e solo quella gara) non lo passa
        // mai, quindi non è mai affetto.
        function renderSessionsBlock(race, idPrefix, { hidePractice = false } = {}) {
            const labels = hidePractice
                ? SESSION_LABELS.filter(([key]) => key !== 'fp1' && key !== 'fp2' && key !== 'fp3')
                : SESSION_LABELS;
            const rows = labels.map(([key, label]) => {
                const session = race.schedule && race.schedule[key];
                const formatted = formatSessionTime(session);
                if (!formatted) return '';
                const status = getSessionStatus(session, SESSION_DURATION_MIN[key]);
                const dotClass = status === 'live' ? 'bg-green-500 animate-pulse' : status === 'past' ? 'bg-gray-600' : 'bg-white';
                // Etichetta e orario usano lo stesso colore in base allo
                // stato: sessione non ancora disputata o in corso devono
                // "accendersi" insieme (nome + orario), non solo l'orario.
                const textClass = status === 'past' ? 'text-gray-500' : 'text-white';
                const liveTag = status === 'live' ? ' <span class="text-green-400 font-bold">● LIVE</span>' : '';

                const results = race.results && race.results[key];
                const hasResults = Array.isArray(results) && results.length > 0;
                const panelId = `${idPrefix}-results-${race.round}-${key}`;

                // Sessione già disputata e con risultati disponibili: "Risultati"
                // (bianco, per leggerlo meglio rispetto ai colori di stato)
                // al posto della data, cliccabile per espandere la tabella.
                const timeCell = (status === 'past' && hasResults)
                    ? `<span role="button" tabindex="0" class="text-white underline decoration-dotted cursor-pointer" onclick="toggleSessionResults('${panelId}')">Risultati</span>`
                    : `${formatted}${liveTag}`;

                const resultsPanel = hasResults
                    ? `<div id="${panelId}" class="hidden col-span-3">${renderResultsTable(results, key)}</div>`
                    : '';

                // "contents" toglie il wrapper dal flusso: i suoi figli (le 3
                // celle + l'eventuale pannello risultati) diventano celle
                // dirette della griglia del genitore, così il pannello si
                // apre esattamente sotto la riga della sessione cliccata.
                return `<div class="contents">
                    <span class="w-1.5 h-1.5 rounded-full ${dotClass}"></span>
                    <span class="${textClass} truncate">${label}</span>
                    <span class="${textClass} text-right whitespace-nowrap">${timeCell}</span>
                    ${resultsPanel}
                </div>`;
            }).join('') || '<span class="col-span-3 text-gray-500 italic">Orari non disponibili.</span>';

            return `<div class="grid grid-cols-[auto_auto_1fr] gap-x-2 gap-y-1 text-[11px] items-center">${rows}</div>`;
        }

        // Espande/richiude gli orari (ora italiana) di un singolo weekend di
        // gara. Il contenuto è già renderizzato in renderRaceList() insieme
        // alla riga stessa: qui si toglie/aggiunge solo la classe "hidden".
        // idPrefix distingue le gare della stagione in corso ("cal") da
        // quelle di un anno precedente ("hist2025", ecc.): senza, due gare
        // con lo stesso round in liste diverse avrebbero id duplicati.
        function toggleRaceSchedule(idPrefix, round) {
            const detail = document.getElementById(`raceSchedule-${idPrefix}-${round}`);
            const chevron = document.getElementById(`raceChevron-${idPrefix}-${round}`);
            if (!detail) return;
            const wasHidden = detail.classList.contains('hidden');
            detail.classList.toggle('hidden', !wasHidden);
            if (chevron) chevron.classList.toggle('rotate-180', wasHidden);
            const header = document.getElementById(`raceHeader-${idPrefix}-${round}`);
            if (header) header.setAttribute('aria-expanded', String(wasHidden));
            scheduleReposition(); // l'altezza di leftColumn è cambiata
        }

        // Elenco gare (round, circuito, date weekend, vincitore) condiviso
        // tra il pannello Calendario (stagione in corso) e il pannello Anni
        // precedenti (una stagione storica alla volta): stesso stile,
        // stesso comportamento di espansione per ogni gara.
        function renderRaceList(races, idPrefix) {
            // Solo per la stagione in corso ('cal'): le prove libere restano
            // visibili solo per il GP in evidenza (l'ultimo disputato/in
            // corso, la stessa gara del widget "Prossimo GP"), nascoste per
            // tutte le altre. Le stagioni storiche non hanno mai prove
            // libere (già escluse a monte in history/{anno}.json), quindi
            // per quelle il confronto sotto è ininfluente.
            const featuredRound = idPrefix === 'cal' ? determineFeaturedRace()?.round : undefined;
            return races.map(r => `
                <div class="bg-gray-900 rounded overflow-hidden">
                    <div role="button" tabindex="0" aria-expanded="false" id="raceHeader-${idPrefix}-${r.round}" class="flex justify-between items-center px-3 py-1.5 gap-2 cursor-pointer hover:bg-gray-800 transition-colors" onclick="toggleRaceSchedule('${idPrefix}', ${r.round})">
                        <span class="text-gray-400 shrink-0">
                            <span class="block">${r.round}. ${escapeHtml(r.circuit)}</span>
                            <span class="block text-[11px] text-gray-500">${formatRaceDateRange(r.weekendStart, r.date)}</span>
                        </span>
                        <span class="flex items-center gap-1.5 min-w-0">
                            <span class="text-right truncate ${r.winner ? 'font-bold text-[#E10600]' : 'text-gray-600 italic'}">
                                ${r.winner ? `${escapeHtml(r.winner.driver)} (${escapeHtml(r.winner.team)})` : 'Da disputare'}
                            </span>
                            <span id="raceChevron-${idPrefix}-${r.round}" class="shrink-0 text-gray-600 text-[10px] transition-transform">▾</span>
                        </span>
                    </div>
                    <div id="raceSchedule-${idPrefix}-${r.round}" class="hidden px-3 pb-2 pt-1 border-t border-gray-800 text-xs">
                        ${renderSessionsBlock(r, idPrefix, { hidePractice: featuredRound !== undefined && r.round !== featuredRound })}
                    </div>
                </div>
            `).join('');
        }

        function renderCalendar() {
            const calendarList = document.getElementById('calendarList');
            const calendarMeta = document.getElementById('calendarMeta');

            if (!calendarData) {
                calendarList.innerHTML = '';
                calendarMeta.innerText = '⚠️ Calendario non disponibile (calendar.json non raggiungibile).';
                return;
            }

            document.getElementById('calendarPanelTitle').innerText = `📅 Calendario & Risultati ${calendarData.season}`;
            calendarList.innerHTML = renderRaceList(calendarData.races, 'cal');

            const updatedDate = new Date(calendarData.updatedAt).toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
            calendarMeta.innerText = `Aggiornato al ${updatedDate}`;
        }

        // --- PANNELLO ANNI PRECEDENTI ---
        // Stagioni storiche disponibili (solo queste per ora): ogni stagione
        // viene scaricata da history/{anno}.json solo al primo click su
        // quell'anno (non tutte insieme al caricamento della pagina), e
        // tenuta in cache in memoria per i click successivi.
        // Popolato da history/index.json (fetch in initApp) - il manifest
        // scritto da scripts/archive-finished-season.js ad ogni stagione
        // appena conclusa, così l'elenco si aggiorna da solo senza dover mai
        // toccare questo file a mano. Valore di ripiego (stagioni note al
        // momento di questo commit) solo se il manifest non fosse
        // raggiungibile per qualche motivo.
        let PREVIOUS_YEARS = [2025, 2024, 2023, 2022, 2021];
        const historyCache = {};
        let currentHistoryYear = null;

        function togglePreviousYearsPanel() {
            const panel = document.getElementById('previousYearsPanel');
            const wasHidden = panel.classList.contains('hidden');
            // I quattro pannelli sono mutuamente esclusivi: aprirne uno chiude gli altri.
            document.getElementById('classificaPanel').classList.add('hidden');
            document.getElementById('calendarPanel').classList.add('hidden');
            document.getElementById('newsPanel').classList.add('hidden');
            panel.classList.toggle('hidden', !wasHidden);
            if (!panel.classList.contains('hidden')) {
                showPreviousYearsList();
            }
            scheduleReposition(); // l'altezza di leftColumn è cambiata
        }

        async function toggleNewsPanel() {
            const panel = document.getElementById('newsPanel');
            const wasHidden = panel.classList.contains('hidden');
            // I quattro pannelli sono mutuamente esclusivi: aprirne uno chiude gli altri.
            document.getElementById('classificaPanel').classList.add('hidden');
            document.getElementById('calendarPanel').classList.add('hidden');
            document.getElementById('previousYearsPanel').classList.add('hidden');
            if (wasHidden) {
                panel.classList.remove('hidden');
                await fadeSwap(panel, () => {
                    renderNews();
                });
            } else {
                panel.classList.add('hidden');
            }
            scheduleReposition(); // l'altezza di leftColumn è cambiata
        }

        // Titolo/autore/link/immagine vengono dal feed RSS esterno di
        // FormulaPassion.it, non dal nostro data.json: li trattiamo come
        // contenuto non fidato ed eseguiamo l'escape prima di inserirli via
        // innerHTML, per sicurezza (a differenza degli altri pannelli, i cui
        // dati arrivano tutti dai nostri script/API già validati).
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Accetta solo URL http(s): escapeHtml da solo non basta per un href,
        // perché uno schema "javascript:" resterebbe cliccabile. Il feed RSS è
        // una fonte esterna non fidata.
        function safeHttpUrl(url) {
            return typeof url === 'string' && /^https?:\/\//i.test(url.trim()) ? url.trim() : '';
        }

        function renderNews() {
            const list = document.getElementById('newsList');
            const meta = document.getElementById('newsMeta');
            if (!newsData || !newsData.items || newsData.items.length === 0) {
                list.innerHTML = '';
                meta.innerText = '⚠️ News non disponibili (news.json non raggiungibile).';
                return;
            }
            list.innerHTML = newsData.items.map(item => `
                <a href="${escapeHtml(safeHttpUrl(item.link) || '#')}" target="_blank" rel="noopener noreferrer" class="flex gap-3 bg-gray-900 hover:bg-gray-800 transition-colors rounded-lg p-2">
                    ${safeHttpUrl(item.image) ? `<img src="${escapeHtml(safeHttpUrl(item.image))}" alt="" class="w-20 h-14 object-cover rounded shrink-0">` : ''}
                    <div class="min-w-0">
                        <p class="text-gray-200 font-medium leading-snug">${escapeHtml(item.title)}</p>
                        <p class="text-xs text-gray-500 mt-1">${formatNewsDate(item.date)}${item.author ? ` · ${escapeHtml(item.author)}` : ''}</p>
                    </div>
                </a>
            `).join('');
            meta.innerText = `Fonte: ${newsData.source}`;
        }

        function formatNewsDate(isoDate) {
            if (!isoDate) return '';
            const d = new Date(isoDate);
            if (isNaN(d)) return '';
            const formatted = d.toLocaleString('it-IT', {
                day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
                timeZone: 'Europe/Rome',
            });
            return formatted.charAt(0).toUpperCase() + formatted.slice(1);
        }

        async function showPreviousYearsList() {
            currentHistoryYear = null;
            document.getElementById('prevYearsBackBtn').classList.add('hidden');
            document.getElementById('previousYearsTitle').innerText = '🕰️ Stagioni precedenti';
            const body = document.getElementById('previousYearsBody');
            await fadeSwap(body, () => {
                body.innerHTML = PREVIOUS_YEARS.map(y => `
                    <button onclick="selectPreviousYear(${y})" class="w-full text-left bg-gray-900 hover:bg-gray-800 transition-colors rounded px-3 py-2 cursor-pointer">
                        ${y}
                    </button>
                `).join('');
                scheduleReposition();
            });
        }

        // Dissolvenza in uscita/entrata attorno a un cambio di contenuto,
        // stesso pattern già usato per il cambio vista del grafico principale
        // (toggleChartView): senza, il pannello passava istantaneamente da
        // "Caricamento..." (poche decine di px) all'elenco completo delle
        // gare (oltre 1000px), uno scatto secco segnalato dall'utente.
        async function fadeSwap(el, updateFn, fadeMs = 150) {
            el.style.opacity = '0';
            await new Promise(r => setTimeout(r, fadeMs));
            updateFn();
            el.style.opacity = '1';
        }

        async function selectPreviousYear(year) {
            currentHistoryYear = year;
            document.getElementById('prevYearsBackBtn').classList.remove('hidden');
            document.getElementById('previousYearsTitle').innerText = `🕰️ Stagione ${year}`;
            const body = document.getElementById('previousYearsBody');

            if (!historyCache[year]) {
                await fadeSwap(body, () => {
                    body.innerHTML = '<div class="text-gray-500 italic">Caricamento...</div>';
                    scheduleReposition();
                });
                try {
                    const res = await fetch(`history/${year}.json`, { cache: 'no-cache' });
                    if (!res.ok) throw new Error(`status ${res.status}`);
                    historyCache[year] = await res.json();
                } catch (err) {
                    console.error(`Impossibile caricare history/${year}.json:`, err);
                    // L'utente potrebbe aver selezionato un altro anno nel
                    // frattempo: non sovrascrivere una vista già cambiata.
                    if (currentHistoryYear === year) {
                        await fadeSwap(body, () => {
                            body.innerHTML = `<div class="text-gray-500 italic">⚠️ Dati non disponibili per il ${year}.</div>`;
                            scheduleReposition();
                        });
                    }
                    return;
                }
                if (currentHistoryYear !== year) return; // vedi commento sopra
            }

            await fadeSwap(body, () => {
                body.innerHTML = renderRaceList(historyCache[year].races, `hist${year}`);
                scheduleReposition();
            });
        }

        // --- WIDGET "PROSSIMO GP": orari sessioni del weekend in evidenza ---
        // (la mini mappa del circuito è stata provata e poi rimossa: i
        // tracciati stilizzati non risultavano abbastanza coerenti/fedeli)

        // Ordine cronologico delle sessioni con relativa etichetta e durata
        // stimata in minuti (l'API non fornisce l'orario di fine sessione,
        // quindi la durata è solo una stima ragionevole, usata unicamente per
        // capire se una sessione è "in corso" adesso).
        const SESSION_DURATION_MIN = {
            fp1: 60, fp2: 60, fp3: 60,
            sprintQualy: 60, sprintRace: 45,
            qualy: 60, race: 130,
        };

        // 'past' | 'live' | 'upcoming', in base all'orario UTC reale adesso.
        function getSessionStatus(session, durationMin) {
            if (!session || !session.date || !session.time) return null;
            const start = new Date(`${session.date}T${session.time}`);
            if (isNaN(start)) return null;
            const now = new Date();
            const end = new Date(start.getTime() + durationMin * 60000);
            if (now < start) return 'upcoming';
            if (now > end) return 'past';
            return 'live';
        }

        // Il GP "in evidenza": resta quello del weekend in corso/prossimo
        // fino alla domenica (data di gara), poi da lunedì passa al
        // successivo - a differenza di determineDefaultCircuit() (che cambia
        // già dal venerdì delle prove libere), qui il cambio è legato
        // esplicitamente alla domenica di gara, su richiesta esplicita.
        function determineFeaturedRace() {
            if (!calendarData) return null;
            const todayStr = localDateStr();
            const upcoming = calendarData.races.find(r => r.date && r.date >= todayStr);
            if (upcoming) return upcoming;
            const past = calendarData.races.filter(r => r.date).sort((a, b) => b.date.localeCompare(a.date));
            return past.length > 0 ? past[0] : null;
        }

        function renderFeaturedRace() {
            const mobileContainer = document.getElementById('featuredRaceWidget');
            const desktopContainer = document.getElementById('featuredRaceWidgetDesktop');
            const race = determineFeaturedRace();
            if (!race) {
                if (mobileContainer) mobileContainer.innerHTML = '';
                if (desktopContainer) desktopContainer.innerHTML = '';
                return;
            }

            // Data del weekend affiancata al nome del circuito (non più su
            // una riga a parte sotto): riduce l'altezza del riquadro di una
            // riga.
            const raceStart = race.schedule && race.schedule.race && race.schedule.race.date && race.schedule.race.time
                ? new Date(`${race.schedule.race.date}T${race.schedule.race.time}`)
                : null;
            const countdown = raceStart ? formatCountdown(raceStart) : null;

            const headerHtml = `<span class="font-bold text-gray-200 text-xs">🏁 ${race.round}. ${escapeHtml(race.circuit)}</span>
                <span class="text-gray-500"> · ${formatRaceDateRange(race.weekendStart, race.date)}</span>` +
                (countdown ? `<span class="text-gray-400"> · ⏳ ${countdown}</span>` : '');

            // idPrefix diverso per mobile/desktop: la stessa gara compare in
            // entrambi i contenitori contemporaneamente (uno nascosto via CSS,
            // non rimosso dal DOM), quindi senza un prefisso diverso gli id dei
            // pannelli "Risultati" sarebbero duplicati sulla pagina.
            //
            // Questa funzione gira ogni 60s e ricostruisce l'HTML: i pannelli
            // "Risultati" che l'utente ha aperto vanno ricordati e riaperti,
            // altrimenti si richiudevano da soli ogni minuto mentre li leggeva.
            const openPanelIds = [...document.querySelectorAll('[id^="widget-"][id*="-results-"]:not(.hidden)')].map(el => el.id);

            if (mobileContainer) {
                mobileContainer.innerHTML = `<div class="bg-[#1E1E1E] p-3 rounded-xl border border-gray-800">
                    <div class="text-[11px] text-gray-500 mb-2">${headerHtml}</div>
                    ${renderSessionsBlock(race, 'widget-mobile')}
                </div>`;
            }
            if (desktopContainer) {
                desktopContainer.innerHTML = `
                    <div class="text-[11px] text-gray-500 mb-2">${headerHtml}</div>
                    ${renderSessionsBlock(race, 'widget-desktop')}
                `;
            }

            openPanelIds.forEach(id => {
                const panel = document.getElementById(id);
                if (panel) panel.classList.remove('hidden');
            });
        }

        function renderChart() {
            const poleCanvas = document.getElementById('poleChart');
            const telemetryPanels = document.getElementById('telemetryPanels');
            const toggleIconBtn = document.getElementById('chartViewToggle');

            if (chartViewMode === 'telemetry') {
                // Il grafico principale e il toggle linea/delta non si
                // applicano qui: nascosti finché non si torna indietro.
                poleCanvas.style.display = 'none';
                telemetryPanels.classList.remove('hidden');
                document.getElementById('telemetryStats').classList.remove('hidden');
                toggleIconBtn.classList.add('hidden');
                if (currentChart) { currentChart.destroy(); currentChart = null; }
                // Su mobile l'altezza normale (200px, dal CSS) è troppo
                // stretta per 3 pannelli leggibili: qui serve più spazio,
                // ripristinato quando si torna alla vista normale sotto.
                chartContainer.style.height = chartContainerHeight();
                renderTelemetryCharts();
                scheduleReposition();
                return;
            }

            chartContainer.style.height = chartContainerHeight();
            poleCanvas.style.display = '';
            telemetryPanels.classList.add('hidden');
            document.getElementById('telemetryStats').classList.add('hidden');
            toggleIconBtn.classList.remove('hidden');
            updateChartViewToggleIcon();

            const filtered = currentFiltered;
            if (currentChart) currentChart.destroy();
            const ctx = poleCanvas.getContext('2d');

            if (chartViewMode === 'delta') {
                // Delta rispetto all'anno precedente per lo stesso circuito: null per il
                // primo anno disponibile (nessun confronto possibile). Negativo = più
                // veloce (verde), positivo = più lento (rosso).
                const deltas = filtered.map((d, i) => i === 0 ? null : +(d.seconds - filtered[i - 1].seconds).toFixed(3));
                currentChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: filtered.map(d => d.year),
                        datasets: [{
                            data: deltas,
                            backgroundColor: deltas.map(v => v === null ? '#4a4a4a' : v < 0 ? '#16a34a' : '#E10600'),
                            borderRadius: 4,
                            maxBarThickness: 48
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        // Il ResizeObserver interno di Chart.js scatta anche alla
                        // creazione del chart e, su desktop, il riposizionamento
                        // delle maniglie (scheduleReposition, subito dopo) forza un
                        // reflow che lo fa scattare troppo presto: senza questo
                        // ritardo Chart.js annulla l'animazione d'ingresso quasi
                        // subito (osservato: si completava in ~10ms invece di 1s).
                        resizeDelay: 200,
                        scales: {
                            y: {
                                grid: { color: '#2a2a2a' },
                                ticks: {
                                    color: '#a0aec0',
                                    callback: function(value) { return (value > 0 ? '+' : '') + value.toFixed(1) + 's'; }
                                }
                            },
                            x: { grid: { display: false }, ticks: { color: '#a0aec0' } }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const v = deltas[context.dataIndex];
                                        if (v === null) return ' Nessun anno precedente';
                                        return ' ' + (v > 0 ? '+' : '') + v.toFixed(3) + 's rispetto al ' + filtered[context.dataIndex - 1].year;
                                    }
                                }
                            }
                        }
                    }
                });
            } else {
                currentChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: filtered.map(d => d.year),
                        datasets: [{
                            data: filtered.map(d => d.seconds),
                            borderColor: '#E10600',
                            backgroundColor: 'rgba(225, 6, 0, 0.1)',
                            borderWidth: 3,
                            tension: 0.2,
                            pointBackgroundColor: '#ffffff',
                            pointHoverBackgroundColor: '#E10600',
                            pointRadius: 5,
                            pointHoverRadius: 7
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        // Il ResizeObserver interno di Chart.js scatta anche alla
                        // creazione del chart e, su desktop, il riposizionamento
                        // delle maniglie (scheduleReposition, subito dopo) forza un
                        // reflow che lo fa scattare troppo presto: senza questo
                        // ritardo Chart.js annulla l'animazione d'ingresso quasi
                        // subito (osservato: si completava in ~10ms invece di 1s).
                        resizeDelay: 200,
                        scales: {
                            y: {
                                grid: { color: '#2a2a2a' },
                                ticks: {
                                    color: '#a0aec0',
                                    callback: function(value) { return formatSecondsToTime(value); }
                                }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#a0aec0' }
                            }
                        },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return " Tempo: " + filtered[context.dataIndex].timeStr;
                                    }
                                }
                            }
                        }
                    }
                });
            }
            scheduleReposition();
        }

        function updateApp(circuitName, viewState = null) {
            currentFiltered = poleData.filter(d => d.circuit === circuitName).sort((a,b) => a.year - b.year);

            // Cambiando circuito si torna alla stagione primaria di default:
            // la vista su un anno specifico (showTelemetryForYear) è legata
            // al box di quel circuito, non ha senso portarla su un altro.
            telemetryPrimarySeason = DEFAULT_TELEMETRY_SEASON;

            // Vista richiesta da un link condiviso (o da una modifica manuale
            // dell'hash): applicata prima del primo render. Valori non validi
            // (anno senza telemetria, confronto inesistente) vengono scartati
            // da updateTelemetryButtonsVisibility() qui sotto, che ripiega sulla
            // vista normale.
            if (viewState && viewState.mode === 'telemetry') {
                // Anno richiesto se ha telemetria per questo circuito, altrimenti
                // quello di default (2026); se manca anche quello, vista normale.
                const requested = viewState.year && /^\d{4}$/.test(viewState.year) ? viewState.year : DEFAULT_TELEMETRY_SEASON;
                const year = getTelemetryEntry(requested, circuitName) ? requested
                    : (getTelemetryEntry(DEFAULT_TELEMETRY_SEASON, circuitName) ? DEFAULT_TELEMETRY_SEASON : null);
                if (year) {
                    telemetryPrimarySeason = year;
                    chartViewMode = 'telemetry';
                    telemetryCompareYear = viewState.compare && /^\d{4}$/.test(viewState.compare) ? viewState.compare : null;
                    updateTelemetryToggleLabel();
                } else {
                    // Telemetria richiesta ma assente per questo circuito: vista normale.
                    chartViewMode = 'line';
                    updateTelemetryToggleLabel();
                }
            } else if (viewState && viewState.mode === 'delta') {
                chartViewMode = 'delta';
                updateTelemetryToggleLabel();
            } else if (viewState) {
                chartViewMode = 'line';
                updateTelemetryToggleLabel();
            }

            // I tasti "Telemetria"/"2025" sono visibili solo se questo
            // circuito ha i rispettivi dati. Se si cambia circuito mentre si
            // è in modalità telemetria e il nuovo circuito non ne ha, si
            // torna automaticamente alla vista normale.
            updateTelemetryButtonsVisibility();

            renderChart();

            // Record storico del circuito = tempo più basso tra tutti gli anni disponibili
            const recordSeconds = currentFiltered.length > 0 ? Math.min(...currentFiltered.map(d => d.seconds)) : null;

            detailsList.innerHTML = '';
            [...currentFiltered].reverse().forEach(d => {
                const isRecord = recordSeconds !== null && d.seconds === recordSeconds;
                // Il box è cliccabile (apre la Telemetria su QUELL'anno) solo
                // se esiste davvero il dato per questo anno+circuito.
                const hasTelemetryForYear = !!getTelemetryEntry(String(d.year), circuitName);
                const card = document.createElement('div');
                card.dataset.year = String(d.year);
                card.className = "bg-[#1E1E1E] p-4 rounded-xl border flex flex-col gap-1 transition-all duration-200 hover:border-gray-700 " +
                    (isRecord ? "border-yellow-500" : "border-gray-800") +
                    (hasTelemetryForYear ? " cursor-pointer" : "");
                if (hasTelemetryForYear) {
                    card.onclick = () => showTelemetryForYear(d.year);
                    card.setAttribute('role', 'button');
                    card.tabIndex = 0;
                    card.title = `Vedi la telemetria del giro di pole ${d.year}`;
                }
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-gray-400">Anno ${d.year} ${isRecord ? '<span class="text-yellow-400" title="Record storico del circuito">🏆 Record</span>' : ''}</span>
                        <span class="text-xl font-black text-[#E10600] tracking-tight">${d.timeStr}</span>
                    </div>
                    <div class="text-sm text-gray-200 mt-1">🏎️ <span class="font-semibold text-white">${escapeHtml(d.driver)}</span></div>
                    <div class="text-xs text-gray-400">Scuderia: <span class="text-gray-300 font-medium">${escapeHtml(d.team)}</span></div>
                    <div class="text-xs text-cyan-400 mt-1 flex items-center gap-1">Metereologia: ${escapeHtml(d.weather)}</div>
                    ${d.penaltyNote ? `<div class="text-xs text-orange-400 mt-1 flex items-start gap-1 border-t border-gray-800 pt-1">⚠️ <span>${escapeHtml(d.penaltyNote)}</span></div>` : ''}
                    ${hasTelemetryForYear ? '<div class="text-xs text-gray-500 mt-1">🏎️ Clicca per la telemetria</div>' : ''}
                `;
                detailsList.appendChild(card);
            });
            updateActiveYearCardHighlight();

            alignChartTop();
            syncUrlState();
        }

        // Elementi cliccabili che non sono <button>/<a> (righe gara, box anno,
        // "Risultati") hanno role="button" e tabindex="0": qui Invio e Spazio
        // li attivano come un click, per l'uso da tastiera e coi lettori
        // schermo. I controlli nativi (button, select, a) sono esclusi.
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const el = e.target;
            if (!el || el.getAttribute?.('role') !== 'button' || /^(BUTTON|A|SELECT|INPUT)$/.test(el.tagName)) return;
            e.preventDefault(); // evita lo scroll della pagina con Spazio
            el.click();
        });

        initApp();

        // Registra il service worker (sw.js) per l'installazione come PWA -
        // vedi manifest.json. Non blocca né rallenta il caricamento della
        // pagina: parte solo dopo che tutto il resto è già pronto.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => {
                    console.warn('Registrazione service worker fallita:', err);
                });
            });
        }
    </script>
</body>
